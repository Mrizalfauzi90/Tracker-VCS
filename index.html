<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker VCS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15130F; --paper:#F2EDE1; --paper-raise:#FFFFFF; --line:#D9D0BA;
    --red:#C4272B; --blue:#0E3C74; --yellow:#EFB215; --green:#2E6B44; --muted:#7C7460;
    --disp:'Archivo Black', 'Arial Black', sans-serif;
    --sans:'Space Grotesk', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  *:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
  body{margin:0;background:var(--paper);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:840px;margin:0 auto;padding:32px 22px 70px;}

  /* ---- Masthead + signature shape trio ---- */
  .masthead{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:5px solid var(--ink);padding-bottom:16px;margin-bottom:24px;}
  .masthead h1{font-family:var(--disp);font-size:30px;margin:0;font-weight:400;letter-spacing:0.5px;line-height:1;}
  .masthead .sub{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:8px;}
  .sub-clickable{cursor:pointer;display:inline-block;padding:3px 6px;margin-left:-6px;border:1.5px dashed transparent;transition:border-color .15s ease,background .15s ease;}
  .sub-clickable:hover{border-color:var(--muted);background:#EAE2CC;}
  .edit-hint{font-size:9px;letter-spacing:1px;color:var(--muted);opacity:0;transition:opacity .15s ease;text-transform:none;font-weight:500;}
  .sub-clickable:hover .edit-hint{opacity:1;}
  .profile-edit{display:flex;flex-direction:column;gap:6px;margin-top:6px;max-width:320px;}
  .profile-edit input{padding:8px 10px;border:2px solid var(--ink);font-family:var(--sans);font-weight:500;font-size:12.5px;background:var(--paper-raise);}
  .profile-edit-actions{display:flex;gap:6px;margin-top:2px;}
  .masthead .date{font-family:var(--sans);font-weight:600;font-size:12px;color:var(--muted);text-align:right;flex-shrink:0;}
  .bh-shapes{display:flex;align-items:center;gap:9px;flex-shrink:0;margin:0 4px;}
  .bh-circle{width:20px;height:20px;border-radius:50%;background:var(--blue);}
  .bh-square{width:18px;height:18px;background:var(--red);}
  .bh-triangle{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:17px solid var(--yellow);}
  @media (max-width:560px){ .bh-shapes{display:none;} }

  /* ---- Year / quarter navigation ---- */
  .year-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-family:var(--sans);}
  .year-row > span{font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;}
  .year-btn{width:34px;height:34px;border:2.5px solid var(--ink);background:var(--paper-raise);cursor:pointer;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease;}
  .year-btn:hover{background:var(--ink);color:var(--paper-raise);}
  .year-label{font-family:var(--disp);font-size:20px;font-weight:400;min-width:64px;text-align:center;}
  .quarter-tabs{display:flex;gap:0;margin-bottom:22px;border:2.5px solid var(--ink);}
  .quarter-tab{flex:1;padding:12px 4px;text-align:center;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:0.5px;background:var(--paper-raise);border-right:2.5px solid var(--ink);transition:background .15s ease,color .15s ease;}
  .quarter-tab:last-child{border-right:none;}
  .quarter-tab:hover{background:#EAE2CC;}
  .quarter-tab.on{background:var(--red);color:#fff;}
  .quarter-tab.on:hover{background:var(--red);}
  .quarter-tab .rng{display:block;font-weight:500;font-size:9.5px;color:var(--muted);margin-top:3px;text-transform:none;letter-spacing:0;}
  .quarter-tab.on .rng{color:#f6d9d5;}

  /* ---- Target + stats ---- */
  .target-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-family:var(--sans);font-size:12.5px;margin-bottom:20px;color:var(--muted);font-weight:500;}
  .target-row input{width:84px;padding:7px 9px;border:2.5px solid var(--ink);font-family:var(--sans);font-weight:700;font-size:13px;background:var(--paper-raise);}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:2.5px;background:var(--ink);margin-bottom:18px;border:2.5px solid var(--ink);}
  .stat{background:var(--paper-raise);padding:16px 8px;text-align:center;}
  .stat:nth-child(1){background:#FBEAE9;}
  .stat:nth-child(2){background:#E7EEF6;}
  .stat .num{font-family:var(--disp);font-size:26px;font-weight:400;line-height:1;}
  .stat .lbl{font-family:var(--sans);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;color:var(--muted);margin-top:8px;}

  .pace-banner{font-family:var(--sans);font-weight:500;font-size:13px;padding:12px 15px;margin-bottom:20px;border:2.5px solid var(--ink);border-left-width:9px;background:var(--paper-raise);}
  .pace-banner.behind{border-left-color:var(--red);}
  .pace-banner.ontrack{border-left-color:var(--green);}
  .pace-banner.closed{border-left-color:var(--muted);}
  .progress-track{height:14px;background:var(--paper-raise);border:2.5px solid var(--ink);margin-bottom:7px;overflow:hidden;}
  .progress-fill{height:100%;background:repeating-linear-gradient(135deg,var(--yellow),var(--yellow) 10px,#e0a30f 10px,#e0a30f 20px);transition:width .4s ease;}
  .progress-caption{font-family:var(--sans);font-weight:600;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:24px;}

  h2.section{font-family:var(--sans);font-size:14px;text-transform:uppercase;letter-spacing:1.6px;border-bottom:3px solid var(--ink);padding-bottom:8px;margin:38px 0 16px;font-weight:700;}
  h2.section:first-of-type{margin-top:0;}

  .tabs{display:flex;gap:0;margin-bottom:18px;border:2.5px solid var(--ink);width:fit-content;}
  .tab-btn{padding:10px 20px;cursor:pointer;font-family:var(--sans);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;background:var(--paper-raise);transition:background .15s ease,color .15s ease;}
  .tab-btn:hover{background:#EAE2CC;}
  .tab-btn.on{background:var(--ink);color:#fff;}
  .tab-btn.on:hover{background:var(--ink);}

  .logform{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px;}
  .logform .full{grid-column:1/-1;}
  label{font-family:var(--sans);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);display:block;margin-bottom:5px;}
  select,input[type=date],input[type=time],input[type=text],input[type=tel],input[type=number]{
    width:100%;padding:11px 12px;border:2.5px solid var(--ink);background:var(--paper-raise);
    font-family:var(--sans);font-weight:500;font-size:13.5px;color:var(--ink);transition:box-shadow .15s ease;
  }
  select:focus,input:focus{box-shadow:3px 3px 0 var(--yellow);}
  select{cursor:pointer;}

  .type-toggle{display:flex;gap:10px;}
  .type-btn{flex:1;padding:11px 0;text-align:center;border:2.5px solid var(--ink);cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:700;background:var(--paper-raise);transition:background .15s ease,color .15s ease;}
  .type-btn.active-call{background:var(--blue);color:#fff;border-color:var(--blue);}
  .type-btn.active-visit{background:var(--red);color:#fff;border-color:var(--red);}

  .add-btn{margin-top:14px;width:100%;padding:14px;background:var(--ink);color:#fff;border:2.5px solid var(--ink);font-family:var(--sans);font-weight:700;font-size:13px;letter-spacing:1px;cursor:pointer;text-transform:uppercase;transition:background .15s ease,transform .1s ease;}
  .add-btn:hover{background:var(--red);border-color:var(--red);}
  .add-btn:active{transform:translateY(1px);}

  .export-btn{background:var(--blue);color:#fff;border:2.5px solid var(--blue);padding:11px 18px;font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:0.7px;cursor:pointer;text-transform:uppercase;transition:background .15s ease;}
  .export-btn:hover{background:var(--ink);border-color:var(--ink);}
  .top-actions{display:flex;justify-content:flex-end;margin-bottom:12px;}

  .entries{margin-top:8px;}
  .entries::-webkit-scrollbar{width:9px;}
  .entries::-webkit-scrollbar-track{background:var(--paper);}
  .entries::-webkit-scrollbar-thumb{background:var(--ink);}
  .entry{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:2px solid var(--line);font-family:var(--sans);}
  .entry .tag{font-size:9.5px;font-weight:700;padding:4px 8px;text-transform:uppercase;letter-spacing:0.6px;flex-shrink:0;color:#fff;}
  .tag.visit{background:var(--red);}
  .tag.call{background:var(--blue);}
  .entry .name{flex:1;font-size:13.5px;font-weight:500;}
  .entry .meta{color:var(--muted);font-size:12px;}
  .entry .date{font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0;text-transform:uppercase;}
  .entry .del{cursor:pointer;color:var(--muted);font-size:19px;line-height:1;padding:2px 6px;flex-shrink:0;transition:color .15s ease;}
  .entry .del:hover{color:var(--red);}
  .empty{font-family:var(--sans);font-weight:500;font-size:13px;color:var(--muted);padding:26px 0;text-align:center;font-style:italic;}

  .cust-row{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:2px solid var(--line);font-family:var(--sans);}
  .cust-row .cname{flex:1;font-size:13.5px;font-weight:500;}
  .cust-row .cmeta{color:var(--muted);font-size:11.5px;}
  .cust-actions{display:flex;gap:7px;flex-shrink:0;}
  .icon-btn{cursor:pointer;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink);border:2px solid var(--ink);padding:6px 11px;background:var(--paper-raise);transition:background .15s ease,color .15s ease;}
  .icon-btn:hover{background:var(--ink);color:#fff;}
  .icon-btn.danger:hover{background:var(--red);border-color:var(--red);color:#fff;}
  .edit-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;padding:12px 4px;border-bottom:2px solid var(--line);align-items:end;background:#EAE2CC;}
  .edit-row-odo{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 14px;padding:14px 4px;border-bottom:2px solid var(--line);align-items:end;background:#EAE2CC;}
  .edit-row-odo input,.edit-row-odo select{min-width:0;}
  .edit-row-odo .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:2px;}
  @media (min-width:600px){ .edit-row-odo{grid-template-columns:repeat(4,1fr);} }
  .search-box{margin-bottom:12px;}
  .search-box label{margin-bottom:5px;}

  .monthly-wrap{margin-bottom:26px;}
  .month-row{display:grid;grid-template-columns:60px 1fr 1fr 56px;gap:10px;align-items:center;padding:8px 0;font-family:var(--sans);font-size:12px;}
  .month-row .mname{font-weight:700;text-transform:uppercase;letter-spacing:0.4px;font-size:11px;}
  .bar-track{height:18px;background:var(--paper-raise);border:2px solid var(--ink);overflow:hidden;position:relative;}
  .bar-fill{height:100%;}
  .bar-fill.visit{background:var(--red);}
  .bar-fill.call{background:var(--blue);}
  .month-total{text-align:right;color:var(--muted);font-weight:600;font-size:11px;}
  .legend{display:flex;gap:18px;font-family:var(--sans);font-weight:600;font-size:11px;color:var(--muted);margin-bottom:12px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend .dot{width:11px;height:11px;display:inline-block;}
  .legend .dot.visit{background:var(--red);border-radius:50%;}
  .legend .dot.call{width:0;height:0;background:transparent;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--blue);}

  .bar-fill.newp{background:var(--yellow);}
  .bar-fill.oldc{background:var(--green);}
  .bar-fill.sales{background:var(--blue);}

  .maintabs{display:flex;gap:0;margin-bottom:20px;border:2.5px solid var(--ink);}
  .maintab-btn{flex:1;padding:12px 8px;text-align:center;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:0.5px;background:var(--paper-raise);text-transform:uppercase;transition:background .15s ease,color .15s ease;}
  .maintab-btn:hover{background:#EAE2CC;}
  .maintab-btn.on{background:var(--ink);color:#fff;}

  .report-card-row{display:grid;grid-template-columns:repeat(2,1fr);gap:2.5px;background:var(--ink);margin-bottom:22px;border:2.5px solid var(--ink);}
  @media (min-width:520px){ .report-card-row{grid-template-columns:repeat(4,1fr);} }
  .report-card{background:var(--paper-raise);padding:16px 10px;text-align:center;}
  .report-card .num{font-family:var(--disp);font-size:22px;font-weight:400;line-height:1.1;word-break:break-word;}
  .report-card .lbl{font-family:var(--sans);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-top:8px;}

  .sales-target-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-family:var(--sans);font-size:12.5px;margin-bottom:16px;color:var(--muted);font-weight:500;}
  .sales-target-row input{width:170px;padding:7px 9px;border:2.5px solid var(--ink);font-family:var(--sans);font-weight:700;font-size:13px;background:var(--paper-raise);}

  .upload-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .upload-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;background:var(--paper-raise);border:2.5px dashed var(--ink);font-family:var(--sans);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;transition:background .15s ease;}
  .upload-btn:hover{background:#EAE2CC;}
  .upload-status{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:600;}
  .extract-note{font-family:var(--sans);font-size:11.5px;color:var(--muted);font-style:italic;margin-bottom:12px;line-height:1.5;}

  .parts-section{border:2px dashed var(--muted);padding:12px;margin-bottom:16px;background:#EAE2CC;}
  .parts-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .parts-header label{font-family:var(--sans);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);}
  .part-row{display:grid;grid-template-columns:1.1fr 1.2fr 60px 110px auto;gap:8px;margin-bottom:8px;align-items:center;}
  .part-row input{padding:9px 10px;border:2px solid var(--ink);font-family:var(--sans);font-size:12.5px;background:var(--paper-raise);}
  .price-hint{font-family:var(--sans);font-size:10.5px;color:var(--green);font-weight:700;font-style:italic;}
  @media (max-width:640px){ .part-row{grid-template-columns:1fr 1fr;grid-template-areas:"a b" "c d" "e e";} .part-row input:nth-child(1){grid-area:a;} .part-row input:nth-child(2){grid-area:b;} .part-row input:nth-child(3){grid-area:c;} .part-row input:nth-child(4){grid-area:d;} .part-row span.del{grid-area:e;justify-self:end;} }

  .setup-wrap{max-width:520px;margin:60px auto;padding:0 20px;}
  .setup-card{border:2.5px solid var(--ink);background:var(--paper-raise);padding:28px 24px;}
  .setup-card h1{font-family:var(--disp);font-size:24px;font-weight:400;margin:0 0 6px;}
  .setup-card p{font-family:var(--sans);font-size:13px;color:var(--muted);line-height:1.7;margin:0 0 16px;}
  .setup-card ol{font-family:var(--sans);font-size:12.5px;color:var(--ink);line-height:1.9;padding-left:20px;margin:0 0 18px;}
  .setup-card input{width:100%;padding:12px;border:2.5px solid var(--ink);font-family:var(--sans);font-weight:500;font-size:13px;margin-bottom:12px;}
  .setup-status{font-family:var(--sans);font-size:12.5px;font-weight:600;margin-top:10px;}
  .setup-status.ok{color:var(--green);}
  .setup-status.bad{color:var(--red);}
  .cloud-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:var(--muted);cursor:pointer;}
  .import-banner{border:2.5px solid var(--ink);background:#FFF3D6;padding:16px;margin-bottom:20px;font-family:var(--sans);}
  .import-banner .msg{font-size:12.5px;font-weight:600;line-height:1.6;margin-bottom:10px;}
  .import-banner .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .cloud-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}
  .cloud-dot.bad{background:var(--red);}
  .report-table{width:100%;border-collapse:collapse;margin-bottom:26px;font-family:var(--sans);font-size:12.5px;}
  .report-table th{background:var(--ink);color:#fff;text-align:left;padding:9px 10px;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:0.4px;}
  .report-table td{padding:8px 10px;border-bottom:1.5px solid var(--line);}
  .report-table tbody tr:nth-child(odd){background:#EAE2CC;}
  .faq-item{margin-bottom:22px;padding-bottom:18px;border-bottom:1.5px solid var(--line);}
  .faq-item h3{font-family:var(--disp);font-size:16px;font-weight:400;margin:0 0 8px;color:var(--ink);}
  .faq-item p{font-family:var(--sans);font-size:12.5px;color:var(--muted);line-height:1.7;margin:0;}

  .quo-doc{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:11px;padding:24px;border:1px solid #999;width:800px;max-width:800px;margin:0 auto;line-height:1.5;}
  .quo-preview-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px 4px;}
  @media screen and (max-width:840px){
    .quo-preview-scroll::after{content:"\2194 geser untuk lihat semua kolom";display:block;text-align:center;font-family:var(--sans);font-size:10.5px;color:var(--muted);margin-top:6px;}
  }
  .quo-logo-circle{width:64px;height:64px;border-radius:50%;background:#C4272B;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;}
  .quo-logo-img{width:64px;height:auto;flex-shrink:0;}
  .quo-manual-header-img{width:100%;max-width:600px;height:auto;display:block;margin-bottom:10px;}
  .quo-ais-header-block{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:10px;}
  .quo-ais-topline{font-size:10px;margin-top:4px;}
  .quo-title{font-size:20px;font-weight:700;letter-spacing:1px;}
  .quo-ais-info{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;margin-bottom:10px;}
  .quo-ais-info-col div{padding:1px 0;}
  .quo-ais-note{font-size:10px;font-style:italic;border-top:1px solid #000;padding-top:6px;margin-bottom:10px;}
  .quo-ais-table{width:100%;border-collapse:collapse;margin-bottom:8px;}
  .quo-ais-table th{border-top:1px solid #000;border-bottom:1px solid #000;padding:4px 6px;text-align:left;font-size:10px;}
  .quo-ais-table td{padding:4px 6px;font-size:10.5px;vertical-align:top;}
  .quo-ais-summary{width:280px;margin-left:auto;border-top:1px solid #000;padding-top:4px;margin-bottom:18px;}
  .quo-ais-summary div{display:flex;justify-content:space-between;padding:2px 0;}
  .quo-ais-summary-total{border-top:1px solid #000;font-weight:700;margin-top:4px;padding-top:4px !important;}
  .quo-ais-footer-note{font-size:9.5px;margin-bottom:24px;}
  .quo-ais-sign-row{display:flex;justify-content:space-between;text-align:center;font-size:10px;font-weight:700;}
  .quo-ais-sign-row > div{width:45%;}
  .quo-sign-line{border-bottom:1px solid #000;margin-top:40px;}
  .quo-ais-sign-name-row{display:flex;justify-content:space-between;text-align:center;font-size:10.5px;margin-top:6px;}
  .quo-ais-sign-name-row > div{width:45%;}

  .quo-manual-header{display:flex;align-items:center;gap:16px;margin-bottom:6px;}
  .quo-manual-company{font-size:17px;font-weight:800;color:#1a3a6b;}
  .quo-manual-addr-line{font-size:9.5px;color:#333;}
  .quo-manual-redline{height:3px;background:#C4272B;margin-bottom:8px;}
  .quo-manual-info{display:flex;justify-content:space-between;font-size:10.5px;margin-bottom:8px;gap:20px;}
  .quo-manual-info > div div{padding:1px 0;}
  .quo-manual-merk-row{font-size:10.5px;margin-bottom:10px;font-weight:700;}
  .quo-manual-table{width:100%;border-collapse:collapse;margin-bottom:14px;border:1px solid #000;}
  .quo-manual-table th,.quo-manual-table td{border:1px solid #000;padding:3px 6px;font-size:10px;}
  .quo-manual-section-head{background:#ED7D31;color:#fff;font-weight:800;text-align:center;font-size:10.5px;}
  .quo-manual-total-lbl{text-align:right;font-weight:700;}
  .quo-manual-total-val{text-align:right;}
  .quo-manual-grandtotal{border-top:2px solid #000;}
  .quo-manual-note-italic{font-style:italic;font-size:10.5px;margin-bottom:30px;}
  .quo-manual-sign-row{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;margin-bottom:50px;}
  .quo-manual-sign-name-row{display:flex;justify-content:space-between;font-size:10.5px;}

  @page {
    size: A4;
    margin: 12mm 10mm;
  }
  @media print {
    body *{visibility:hidden;}
    #quotationPrintArea, #quotationPrintArea *{visibility:visible;}
    #quotationPrintArea{position:absolute;left:0;top:0;width:100%;border:none;max-width:none;padding:0;}
    .no-print{display:none !important;}

    /* Header tabel diulang otomatis tiap ganti halaman kalau tabelnya panjang */
    .quo-ais-table thead, .quo-manual-table thead{display:table-header-group;}
    .quo-ais-table tr, .quo-manual-table tr{page-break-inside:avoid;}

    /* Blok total, catatan masa berlaku, dan tanda tangan tidak boleh terpotong di tengah halaman */
    .quo-ais-summary, .quo-ais-footer-note, .quo-ais-sign-row, .quo-ais-sign-name-row{page-break-inside:avoid;}
    .quo-manual-note-italic, .quo-manual-sign-row, .quo-manual-sign-name-row{page-break-inside:avoid;}
    .quo-manual-table{page-break-inside:auto;}
    .quo-manual-total-row{page-break-inside:avoid;}

    /* Kalau bagian tanda tangan kebetulan jatuh di awal halaman baru, jangan sampai kepisah dari catatan sebelumnya */
    .quo-manual-signblock, .quo-ais-signblock{page-break-inside:avoid;}
  }

  .footnote{font-family:var(--sans);font-weight:500;font-size:11px;color:var(--muted);margin-top:34px;line-height:1.7;border-top:3px solid var(--ink);padding-top:16px;}

  .combo-wrap{position:relative;}
  .combo-list{position:absolute;top:calc(100% + 3px);left:0;right:0;background:var(--paper-raise);border:2.5px solid var(--ink);max-height:230px;overflow-y:auto;z-index:20;box-shadow:4px 4px 0 var(--ink);}
  .combo-item{padding:10px 12px;font-family:var(--sans);font-weight:500;font-size:13.5px;cursor:pointer;border-bottom:2px solid var(--line);}
  .combo-item:last-child{border-bottom:none;}
  .combo-item:hover,.combo-item.hi{background:var(--red);color:#fff;}
  .combo-item .cmeta{color:var(--muted);font-size:11.5px;}

  .combo-empty{padding:11px 12px;font-family:var(--sans);font-size:12px;color:var(--muted);font-style:italic;}

<script>
// Cloud storage: talks to JSONBin.io (satu "bin" JSON dipakai sebagai database sederhana)
// sehingga data bisa diinput dari HP, PC, atau perangkat mana saja dan tetap sinkron,
// dan proses setup-nya cukup lewat form di browser (tidak perlu buka editor kode apapun).
function getCloudCfg(){
  try{
    return {
      apiKey: localStorage.getItem("tracker_jsonbin_key") || "",
      binId: localStorage.getItem("tracker_jsonbin_bin") || ""
    };
  }catch(e){ return {apiKey:"", binId:""}; }
}
function setCloudCfg(apiKey, binId){
  try{
    localStorage.setItem("tracker_jsonbin_key", apiKey);
    localStorage.setItem("tracker_jsonbin_bin", binId);
  }catch(e){}
}
function clearCloudCfg(){
  try{
    localStorage.removeItem("tracker_jsonbin_key");
    localStorage.removeItem("tracker_jsonbin_bin");
  }catch(e){}
}
window.__getCloudCfg = getCloudCfg;
window.__setCloudCfg = setCloudCfg;
window.__clearCloudCfg = clearCloudCfg;

function jsonbinReadAll(){
  var cfg = getCloudCfg();
  if(!cfg.apiKey || !cfg.binId) return Promise.reject(new Error("Cloud belum terhubung"));
  return fetch("https://api.jsonbin.io/v3/b/" + cfg.binId + "/latest?t=" + Date.now(), {
    headers: { "X-Master-Key": cfg.apiKey, "X-Bin-Meta": "false" },
    cache: "no-store"
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(data){ return data || {}; });
}
function jsonbinWriteAll(dataObj){
  var cfg = getCloudCfg();
  if(!cfg.apiKey || !cfg.binId) return Promise.reject(new Error("Cloud belum terhubung"));
  return fetch("https://api.jsonbin.io/v3/b/" + cfg.binId, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Master-Key": cfg.apiKey },
    body: JSON.stringify(dataObj)
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}
window.__jsonbinReadAll = jsonbinReadAll;
window.__jsonbinWriteAll = jsonbinWriteAll;

window.storage = {
  get: function(key){
    return jsonbinReadAll().then(function(data){
      if(data && data[key] !== undefined && data[key] !== null && data[key] !== ""){
        return { key: key, value: data[key] };
      }
      throw new Error("not found");
    });
  },
  set: function(key, value){
    return jsonbinReadAll().catch(function(){ return {}; }).then(function(data){
      data[key] = value;
      return jsonbinWriteAll(data);
    }).then(function(){ return { key: key, value: value }; });
  },
  delete: function(key){
    return jsonbinReadAll().catch(function(){ return {}; }).then(function(data){
      delete data[key];
      return jsonbinWriteAll(data);
    }).then(function(){ return { key: key, deleted: true }; });
  },
  list: function(prefix){
    return jsonbinReadAll().then(function(data){
      var keys = Object.keys(data||{}).filter(function(k){ return !prefix || k.indexOf(prefix)===0; });
      return { keys: keys };
    });
  }
};
</script>

function pad2(n){ return n<10 ? "0"+n : ""+n; }
function lastDayOfMonth(year, monthIdx){ return new Date(year, monthIdx+1, 0).getDate(); }
function getQuarters(year){
  return QUARTER_TEMPLATE.map(t=>{
    const startD = `${year}-${pad2(t.mStart+1)}-01`;
    const endD = `${year}-${pad2(t.mEnd+1)}-${pad2(lastDayOfMonth(year,t.mEnd))}`;
    return {
      id:t.id,
      label:`${t.id} ${year}`,
      range:`${MONTH_NAMES_ID[t.mStart]} \u2013 ${MONTH_NAMES_ID[t.mEnd]}`,
      start:startD, end:endD,
      defaultTarget: t.defaultTargetBase
    };
  });
}

function quarterKeyForDate(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const y = d.getFullYear();
  const m = d.getMonth();
  const qt = QUARTER_TEMPLATE.find(t=> m>=t.mStart && m<=t.mEnd) || QUARTER_TEMPLATE[0];
  return { year:y, qId:qt.id, key: y+"_"+qt.id };
}
function formatRupiah(n){
  if(n==null || isNaN(n)) return "Rp 0";
  return "Rp " + Math.round(n).toLocaleString("id-ID");
}
function parseIDNumber(str){
  str = (str||"").trim();
  const lastDot = str.lastIndexOf(".");
  const lastComma = str.lastIndexOf(",");
  const lastSep = Math.max(lastDot, lastComma);
  if(lastSep>-1 && str.length-lastSep-1===2){
    return Number(str.slice(0,lastSep).replace(/[.,]/g,""));
  }
  return Number(str.replace(/[.,]/g,""));
}
function extractDocNo(text){
  let m = text.match(/DOCUMENT\s*NO\.?\s*:?\s*([A-Z0-9][A-Z0-9.\-\/]{3,24})/i);
  if(m) return m[1].trim().toUpperCase();
  m = text.match(/\bPQ\s?\d{4,6}(?:\s*REV\.?\s*\d+)?\b/i);
  if(m) return m[0].replace(/\s+/g," ").trim().toUpperCase();
  m = text.match(/\bNO\.?\s*(?:PO|P\.?O\.?)\s*:?\s*([A-Z0-9.\-\/]{4,24})/i);
  if(m) return m[1].trim().toUpperCase();
  m = text.match(/\bPO\.?\s?(\d{6,})\b/i);
  if(m) return "PO"+m[1];
  m = text.match(/\bP\d{6,}\b/);
  if(m) return m[0].toUpperCase();
  return "";
}
// Parser gabungan buat baca quotation PDF (dipakai baik oleh Data Penjualan maupun Buat Penawaran)
function parseQuotationText(fullText){
  fullText = fullText.replace(/\bI\s*D\s*R\b/gi, "IDR");
  const lines = fullText.split("\n").map(l=>l.trim());

  let guessedNominal = null;
  const sectionTotals = [];
  for(let i=0;i<lines.length;i++){
    if(/^PPN\b/i.test(lines[i])){
      for(let j=i+1;j<Math.min(i+3,lines.length);j++){
        const m = lines[j].match(/Total\s*(?:Value)?\s*(?:IDR)?\s*([\d]{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?)/i);
        if(m){ sectionTotals.push(parseIDNumber(m[1])); break; }
      }
    }
  }
  if(sectionTotals.length){
    guessedNominal = sectionTotals.reduce((a,b)=>a+b,0);
  } else {
    const totalRegex = /\bTOTAL\b(?!\s*VALUE)[^\dRp\n]{0,10}(?:Rp\.?\s*)?([\d]{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?)/gi;
    const totalMatches = [...fullText.matchAll(totalRegex)];
    if(totalMatches.length){
      const nums = totalMatches.map(m=>parseIDNumber(m[1])).filter(n=>!isNaN(n)&&n>0);
      if(nums.length) guessedNominal = nums.reduce((a,b)=>a+b,0);
    }
  }
  if(!guessedNominal){
    const allNums = [...fullText.matchAll(/([\d]{1,3}(?:[.,]\d{3}){2,}(?:[.,]\d{1,2})?)/g)].map(m=>m[1]);
    const parsed = allNums.map(parseIDNumber).filter(n=>!isNaN(n)&&n>0);
    if(parsed.length) guessedNominal = Math.max(...parsed);
  }

  const guessedDocNo = extractDocNo(fullText);

  let guessedType = "Quotation";
  if(/\bP\.?O\.?\b|\bPURCHASE ORDER\b/i.test(fullText)) guessedType = "PO";
  else if(/QUOTATION/i.test(fullText)) guessedType = "Quotation";

  let guessedCustomer = "";
  const custMatch = fullText.match(/CUSTOMER\s*:?\s*([A-Z0-9.,'&\-\s]{5,60}?)(?=\n|ADDRESS|ATTN|REMARKS|MERK|DOC|$)/i);
  if(custMatch) guessedCustomer = custMatch[1].trim().replace(/\s{2,}/g," ");

  let guessedAddress = "";
  const LABELS_RE = /\b(?:PHONE|N\.P\.W\.P|DEL\.ADDR|MODEL|REMARKS|FAX|CURR|MERK|DOCUMENT|SERIAL)\b/i;
  const addrLineIdx = lines.findIndex(l=>/^ADDRESS\s*:?/i.test(l));
  if(addrLineIdx>-1){
    let addr = lines[addrLineIdx].replace(/^ADDRESS\s*:?/i,"").trim();
    const nextLine = lines[addrLineIdx+1];
    if(nextLine && !/^(BRANCH|CUSTOMER|ADDRESS|PHONE|N\.P\.W\.P|DEL\.ADDR|MODEL|REMARKS|FAX|CURR|MERK|DOCUMENT|SERIAL|NOTE|NO\.)/i.test(nextLine)){
      addr += " " + nextLine;
    }
    addr = addr.split(LABELS_RE)[0];
    guessedAddress = addr.replace(/[,\s]+$/,"").trim();
  }

  let guessedDate = "";
  const docDateMatch = fullText.match(/DOCUMENT\s*DATE\s*:?\s*(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/i);
  const dateMatch = docDateMatch || fullText.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(dateMatch){
    let [_, dd, mm, yy] = dateMatch;
    if(yy.length===2) yy = "20"+yy;
    dd = dd.padStart(2,"0"); mm = mm.padStart(2,"0");
    const candidate = `${yy}-${mm}-${dd}`;
    if(!isNaN(new Date(candidate).getTime())) guessedDate = candidate;
  }

  let guessedModel = "";
  const modelMatch = fullText.match(/\bMODEL\s*:?\s*([A-Z0-9\-]{2,20})/i);
  if(modelMatch) guessedModel = modelMatch[1].trim().toUpperCase();

  let guessedSN = "";
  const snMatch = fullText.match(/SERIAL\s*NO\s*:?\s*([A-Z0-9\-]{2,20})/i);
  if(snMatch) guessedSN = snMatch[1].trim().toUpperCase();

  const rowRegex = /^(\d{1,3})\s+(\d{1,3}\*?)\s+([A-Z0-9][A-Z0-9\-\.\/]{2,24})\s+(.+?)\s+(\d{1,6})\s+([\d.,]{2,})\s+IDR\s+([\d.,]{2,})\s*$/i;
  const guessedParts = [];
  for(const line of lines){
    const m = line.match(rowRegex);
    if(m){
      guessedParts.push({
        partNo: m[3],
        desc: m[4].trim(),
        qty: String(Number(m[5])||""),
        unitPrice: String(parseIDNumber(m[6])||"")
      });
    }
  }

  return { fullText, lines, guessedNominal, sectionTotals, guessedDocNo, guessedType, guessedCustomer, guessedAddress, guessedDate, guessedModel, guessedSN, guessedParts };
}
async function readPdfAsText(file){
  const buf = await file.arrayBuffer();
  const typedArray = new Uint8Array(buf);
  const pdf = await window.pdfjsLib.getDocument({data: typedArray}).promise;
  let fullText = "";
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const lineMap = {};
    content.items.forEach(item=>{
      const y = Math.round(item.transform[5]);
      if(!lineMap[y]) lineMap[y] = [];
      lineMap[y].push(item);
    });
    const lineYs = Object.keys(lineMap).map(Number).sort((a,b)=>b-a);
    const pageLines = lineYs.map(y=>{
      const its = lineMap[y].slice().sort((a,b)=>a.transform[4]-b.transform[4]);
      return its.map(it=>it.str).join(" ").replace(/\s+/g," ").trim();
    });
    fullText += pageLines.join("\n") + "\n";
  }
  return fullText;
}
function formatNominalDisplay(raw){
  if(raw===""||raw==null) return "";
  const n = Number(String(raw).replace(/\D/g,""));
  if(isNaN(n)) return "";
  return n.toLocaleString("id-ID");
}
function isWorkday(d, holidays){
  const day = d.getDay();
  if(day===0||day===6) return false;
  if(holidays.includes(d.toISOString().slice(0,10))) return false;
  return true;
}
function countWorkdaysBetween(start,end,holidays){
  let c=0; let d=new Date(start); d.setHours(0,0,0,0);
  const e=new Date(end); e.setHours(0,0,0,0);
  if(d>e) return 0;
  while(d<=e){ if(isWorkday(d,holidays)) c++; d.setDate(d.getDate()+1); }
  return c;
}

        let localArr = null, cloudArr = null;

  const backupFileInputRef = useRef(null);
  const [backupFileBusy,setBackupFileBusy] = useState(false);
  const [backupFileErr,setBackupFileErr] = useState("");
  const [backupFileDone,setBackupFileDone] = useState(false);
  const importFromBackupFile = (file)=>{
    setBackupFileBusy(true); setBackupFileErr(""); setBackupFileDone(false);
    const reader = new FileReader();
    reader.onerror = ()=>{
      setBackupFileErr("Gagal membaca file dari perangkat ini. Coba pilih ulang file-nya.");
      window.alert("GAGAL membaca file dari perangkat ini. Coba pilih ulang file-nya.");
      setBackupFileBusy(false);
      if(backupFileInputRef.current) backupFileInputRef.current.value = "";
    };
    reader.onload = async(ev)=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        const keyCount = Object.keys(parsed).length;
        if(keyCount===0){
          throw new Error("File JSON ini kosong, tidak ada data untuk di-import.");
        }
        const cloudData = await window.__jsonbinReadAll();
        let count = 0, mergedArrays = 0, addedNew = 0, keptExisting = 0;
        for(const k in parsed){
          if(!Object.prototype.hasOwnProperty.call(parsed, k)) continue;
          const backupRaw = parsed[k];
          const cloudRaw = cloudData[k];
          let backupArr = null, cloudArr = null;
          try{ backupArr = JSON.parse(backupRaw); }catch(e){ backupArr = null; }
          try{ cloudArr = cloudRaw!=null ? JSON.parse(cloudRaw) : null; }catch(e){ cloudArr = null; }

          if(Array.isArray(backupArr) && backupArr.every(x=>x && x.id!=null)){
            // Data berbentuk daftar (visit/sales/odo/customer) -> GABUNG aman berdasarkan id,
            // tidak pernah menghapus data yang sudah ada di cloud walau file backup-nya lebih lama/kosong.
            const map = {};
            if(Array.isArray(cloudArr)) cloudArr.forEach(item=>{ if(item && item.id!=null) map[item.id]=item; });
            backupArr.forEach(item=>{ if(item && item.id!=null && !map[item.id]) map[item.id]=item; });
            const merged = Object.values(map);
            cloudData[k] = JSON.stringify(merged);
            mergedArrays++;
          } else if(cloudRaw===undefined || cloudRaw===null || cloudRaw===""){
            // Key belum ada di cloud sama sekali -> aman diisi dari backup
            cloudData[k] = backupRaw;
            addedNew++;
          } else {
            // Key non-list (profile/target angka) sudah ada isinya di cloud -> jangan ditimpa otomatis,
            // biar tidak ada risiko mengganti setting yang sedang aktif dipakai.
            keptExisting++;
          }
          count++;
        }
        await window.__jsonbinWriteAll(cloudData);
        setBackupFileDone(true);
        window.alert("BERHASIL. " + count + " key diproses dari file backup ("+mergedArrays+" daftar digabung aman, "+addedNew+" data baru ditambah, "+keptExisting+" setting lama dipertahankan). Tidak ada data yang dihapus. Halaman akan dimuat ulang sekarang.");
        window.location.reload();
      }catch(e){
        const msg = "GAGAL import file backup. Detail: " + (e && e.message ? e.message : String(e));
        setBackupFileErr(msg);
        window.alert(msg);
      }finally{
        setBackupFileBusy(false);
        if(backupFileInputRef.current) backupFileInputRef.current.value = "";
      }
    };
    reader.readAsText(file);
  };

  // Migrasi satu kali: pindahkan data odometer lama (tersimpan di satu kunci global "odo_log",
  // sebelum sistem per-kuartal dipakai) ke bucket per-kuartal sesuai tanggalnya masing-masing.
  useEffect(()=>{
    (async()=>{
      try{
        const legacy = await window.storage.get("odo_log");
        if(!legacy || !legacy.value) return;
        const oldRecords = JSON.parse(legacy.value);
        if(!Array.isArray(oldRecords) || oldRecords.length===0){
          try{ await window.storage.delete("odo_log"); }catch(e){}
          return;
        }
        const buckets = {};
        for(const r of oldRecords){
          if(!r.date) continue;
          const q = quarterKeyForDate(r.date);
          if(!buckets[q.key]) buckets[q.key] = [];
          buckets[q.key].push(r);
        }
        for(const key in buckets){
          let existing = [];
          try{
            const res = await window.storage.get("odo_records_"+key);
            existing = (res && res.value) ? JSON.parse(res.value) : [];
          }catch(e){ existing = []; }
          const existingIds = new Set(existing.map(x=>x.id));
          const merged = [...existing, ...buckets[key].filter(x=>!existingIds.has(x.id))];
          await window.storage.set("odo_records_"+key, JSON.stringify(merged));
        }
        await window.storage.delete("odo_log");
        setOdoByKey(prev=>({...prev, ...buckets}));
        setInfo("Data odometer lama berhasil dipindahkan otomatis supaya sesuai kuartal tanggalnya masing-masing.");
      }catch(e){
        // Tidak ada data lama untuk dimigrasi, aman diabaikan.
      }
    })();
  },[]);

      const newProspect = es.filter(e=>e.isNew).length;
      const existingCust = (visit+call) - newProspect;
      const salesVal = ss.reduce((sum,s)=>sum+(Number(s.nominal)||0),0);
      const tgt = targetByKey[key] ?? q.defaultTarget;
      return {id:q.id, label:q.id, visit, call, newProspect, existingCust, salesVal, target:tgt};
    });
    const totalVisit = perQ.reduce((s,q)=>s+q.visit,0);
    const totalCall = perQ.reduce((s,q)=>s+q.call,0);
    const totalNewProspect = perQ.reduce((s,q)=>s+q.newProspect,0);
    const totalExisting = perQ.reduce((s,q)=>s+q.existingCust,0);
    const totalSales = perQ.reduce((s,q)=>s+q.salesVal,0);
    const maxVisitCall = Math.max(1, ...perQ.map(q=>Math.max(q.visit,q.call)));
    const maxProspect = Math.max(1, ...perQ.map(q=>Math.max(q.newProspect,q.existingCust)));

  const salesProgressPct = salesTarget>0 ? Math.min(100, Math.round((annualReport.totalSales/salesTarget)*100)) : 0;

  const partCustomerReport = useMemo(()=>{
    const allSalesYear = quarters.flatMap(q => salesByKey[year+"_"+q.id] || []);
    const partMap = {}; // partNo -> {partNo, desc, qty, totalValue, customers:Set}
    const custMap = {}; // customer -> {customer, txCount, totalNominal}
    for(const s of allSalesYear){
      const custKey = s.customer || "(tanpa nama)";
      if(!custMap[custKey]) custMap[custKey] = {customer:custKey, txCount:0, totalNominal:0};
      custMap[custKey].txCount += 1;
      custMap[custKey].totalNominal += Number(s.nominal)||0;

      if(s.parts && s.parts.length){
        for(const p of s.parts){
          const pk = (p.partNo||"").trim();
          if(!pk) continue;
          if(!partMap[pk]) partMap[pk] = {partNo:pk, desc:p.desc||"", qty:0, totalValue:0, customers:new Set()};
          const qtyNum = Number(p.qty)||0;
          const unitPriceNum = Number(p.unitPrice)||0;
          partMap[pk].qty += qtyNum;
          partMap[pk].totalValue += qtyNum*unitPriceNum;
          if(!partMap[pk].desc && p.desc) partMap[pk].desc = p.desc;
          partMap[pk].customers.add(custKey);
        }
      }
    }
    const partList = Object.values(partMap)
      .map(p=>({partNo:p.partNo, desc:p.desc, qty:p.qty, totalValue:p.totalValue, customerCount:p.customers.size}))
      .sort((a,b)=> b.qty - a.qty);
    const custList = Object.values(custMap).sort((a,b)=> b.txCount - a.txCount || b.totalNominal - a.totalNominal);

    });
    // Sumber 2: histori Data Penjualan yang sudah termuat (jaga-jaga ada part lama sebelum katalog global ada)
    Object.values(salesByKey).forEach(arr=>{

        });

    return Object.values(map).sort((a,b)=> a.partNo.localeCompare(b.partNo));

  const findKnownPart = (partNo)=> knownParts.find(p=>p.partNo.toUpperCase()===String(partNo||"").trim().toUpperCase());

  const findKnownPartFromCombined = (text)=>{

      return {"Bulan":label, "Visit":mv, "Call":mc, "Total":mv+mc};
    });
    const wsMonthly = XLSX.utils.json_to_sheet(monthRows);
    wsMonthly["!cols"] = [{wch:18},{wch:8},{wch:8},{wch:8}];
    XLSX.utils.book_append_sheet(wb, wsMonthly, quarter.label+" Per Bulan");

    const salesRowsQ = [...salesEntries].sort((a,b)=> (a.date<b.date?-1:1) || a.id-b.id ).map((s,i)=>({
      "No": i+1, "Tanggal": s.date, "Customer": s.customer, "No. Dokumen": s.docNo||"",
      "Jenis": s.docType||"", "Nominal (Rp)": s.nominal||0,
      "Rincian Part": (s.parts&&s.parts.length) ? s.parts.map(p=>p.partNo+" x"+p.qty+(p.unitPrice?" @Rp"+p.unitPrice.toLocaleString("id-ID"):"")).join(", ") : "",
      "Catatan": s.note||""
    }));
    const wsSales = salesRowsQ.length ? XLSX.utils.json_to_sheet(salesRowsQ) : XLSX.utils.aoa_to_sheet([["Belum ada data penjualan untuk kuartal ini"]]);
    wsSales["!cols"] = [{wch:5},{wch:12},{wch:32},{wch:16},{wch:12},{wch:16},{wch:36},{wch:30}];
    XLSX.utils.book_append_sheet(wb, wsSales, "Penjualan "+quarter.label);

    const odoRowsQ = [...odoRecords].filter(r=>r.date && r.date>=quarter.start && r.date<=quarter.end).sort((a,b)=> a.date<b.date?-1:1);
    const odoRows = odoRowsQ.map((r,i)=>{
      const sameDayEntries = entries.filter(e=>e.date===r.date);
      const custNames = [...new Set(sameDayEntries.map(e=>e.customer+(e.type==="call"?" (Call)":"")))];
      return {
        "No": i+1, "Tanggal": r.date,
        "Jam Berangkat": r.jamPergi||"", "Odo Berangkat (km)": r.before!=null?r.before:"", "Bensin Berangkat": r.bbmBefore||"",
        "Jam Pulang": r.jamPulang||"", "Odo Pulang (km)": r.after!=null?r.after:"", "Bensin Pulang": r.bbmAfter||"",
        "Jarak Tempuh (km)": (r.before!=null&&r.after!=null&&r.after>=r.before)?(r.after-r.before):"",
        "Customer Dikunjungi": custNames.length ? custNames.join(", ") : "-"
      };
    });
    const wsOdo = odoRows.length ? XLSX.utils.json_to_sheet(odoRows) : XLSX.utils.aoa_to_sheet([["Belum ada data odometer untuk kuartal ini"]]);
    wsOdo["!cols"] = [{wch:5},{wch:12},{wch:12},{wch:14},{wch:14},{wch:12},{wch:14},{wch:14},{wch:14},{wch:50}];
    XLSX.utils.book_append_sheet(wb, wsOdo, "Odometer "+quarter.label);

    const fnameUser = (profile.name || "Tracker").replace(/[^a-zA-Z0-9]/g,"");
    XLSX.writeFile(wb, "Visit_Tracker_"+fnameUser+"_"+quarter.label.replace(/\s+/g,"")+"_"+today.toISOString().slice(0,10)+".xlsx");
  };

  const exportAnnualReport = ()=>{
    const wb = XLSX.utils.book_new();

    const summaryRows = annualReport.perQ.map(q=>({
      "Kuartal": q.label, "Visit": q.visit, "Call": q.call,
      "Target Visit": q.target, "Capaian Visit": q.target>0?Math.round((q.visit/q.target)*100)+"%":"-",
      "Prospek Baru": q.newProspect, "Customer Lama": q.existingCust,
      "Penjualan (Rp)": q.salesVal
    }));
    summaryRows.push({
      "Kuartal": "TOTAL "+year, "Visit": annualReport.totalVisit, "Call": annualReport.totalCall,
      "Target Visit": "-", "Capaian Visit": "-",
      "Prospek Baru": annualReport.totalNewProspect, "Customer Lama": annualReport.totalExisting,
      "Penjualan (Rp)": annualReport.totalSales
    });
    const wsSummary = XLSX.utils.json_to_sheet(summaryRows);
    wsSummary["!cols"] = [{wch:12},{wch:8},{wch:8},{wch:12},{wch:12},{wch:12},{wch:12},{wch:16}];
    XLSX.utils.book_append_sheet(wb, wsSummary, "Ringkasan Tahunan "+year);

    const targetRow = XLSX.utils.aoa_to_sheet([
      ["Target Penjualan Tahun "+year, salesTarget],
      ["Realisasi Penjualan", annualReport.totalSales],
      ["Capaian", salesTarget>0 ? Math.round((annualReport.totalSales/salesTarget)*100)+"%" : "-"]
    ]);
    targetRow["!cols"] = [{wch:26},{wch:18}];
    XLSX.utils.book_append_sheet(wb, targetRow, "Target Penjualan");

    for(const q of quarters){
      const key = year+"_"+q.id;
      const ss = [...(salesByKey[key]||[])].sort((a,b)=> (a.date<b.date?-1:1) || a.id-b.id );
      const salesRows = ss.map((s,i)=>({
        "No": i+1, "Tanggal": s.date, "Customer": s.customer, "No. Dokumen": s.docNo||"",
        "Jenis": s.docType||"", "Nominal (Rp)": s.nominal||0,
        "Rincian Part": (s.parts&&s.parts.length) ? s.parts.map(p=>p.partNo+" x"+p.qty+(p.unitPrice?" @Rp"+p.unitPrice.toLocaleString("id-ID"):"")).join(", ") : "",
        "Catatan": s.note||""
      }));
      const wsS = salesRows.length ? XLSX.utils.json_to_sheet(salesRows) : XLSX.utils.aoa_to_sheet([["Belum ada data penjualan untuk kuartal ini"]]);
      wsS["!cols"] = [{wch:5},{wch:12},{wch:32},{wch:16},{wch:12},{wch:16},{wch:36},{wch:30}];
      XLSX.utils.book_append_sheet(wb, wsS, "Penjualan "+q.label);
    }

    const partRows = partCustomerReport.partList.map((p,i)=>({
      "No": i+1, "No. Part": p.partNo, "Nama Part": p.desc||"", "Total Qty Terjual": p.qty,
      "Total Nilai sebelum diskon (Rp)": p.totalValue, "Jml Customer": p.customerCount
    }));
    const wsPart = partRows.length ? XLSX.utils.json_to_sheet(partRows) : XLSX.utils.aoa_to_sheet([["Belum ada rincian part yang diisi tahun ini"]]);
    wsPart["!cols"] = [{wch:5},{wch:18},{wch:32},{wch:16},{wch:20},{wch:14}];
    XLSX.utils.book_append_sheet(wb, wsPart, "Part Terjual "+year);

    const custRankRows = partCustomerReport.custList.map((c,i)=>({
      "No": i+1, "Customer": c.customer, "Jml Transaksi": c.txCount, "Total Nilai (Rp)": c.totalNominal
    }));
    const wsCustRank = custRankRows.length ? XLSX.utils.json_to_sheet(custRankRows) : XLSX.utils.aoa_to_sheet([["Belum ada data penjualan tahun ini"]]);
    wsCustRank["!cols"] = [{wch:5},{wch:34},{wch:14},{wch:18}];
    XLSX.utils.book_append_sheet(wb, wsCustRank, "Ranking Customer "+year);

    const custRows = [...customers].sort((a,b)=>a.name.localeCompare(b.name)).map((c,i)=>({
      "No": i+1, "Nama Customer": c.name, "PIC": c.pic||"", "No. HP": c.phone||"", "Status": c.active?"Aktif":"Nonaktif"
    }));
    const wsCust = XLSX.utils.json_to_sheet(custRows);
    wsCust["!cols"] = [{wch:5},{wch:34},{wch:16},{wch:16},{wch:10}];
    XLSX.utils.book_append_sheet(wb, wsCust, "Daftar Customer");

    const fnameUser = (profile.name || "Tracker").replace(/[^a-zA-Z0-9]/g,"");
    XLSX.writeFile(wb, "Laporan_Tahunan_"+fnameUser+"_"+year+"_"+today.toISOString().slice(0,10)+".xlsx");
  };

  return (
    <div className="wrap">
      <div className="masthead">
        <div>
          <h1>Tracker VCS</h1>
          {editingProfile ? (
            <div className="profile-edit">
              <input type="text" value={profileNameDraft} onChange={e=>setProfileNameDraft(e.target.value)} placeholder="Nama lengkap" />
              <input type="text" value={profileSubDraft} onChange={e=>setProfileSubDraft(e.target.value)} placeholder="Jabatan & cabang, mis. CSO Depo Cilegon (BRC 02)" />
              <div className="profile-edit-actions">
                <button className="icon-btn" onClick={saveProfile}>Simpan</button>
                <button className="icon-btn" onClick={cancelProfileEdit}>Batal</button>
              </div>
            </div>
          ) : (
            <div className="sub sub-clickable" onClick={()=>setEditingProfile(true)} title="Klik untuk edit nama & jabatan">
              {(profile.name || profile.sub) ? (
                <React.Fragment>{profile.name}{profile.name && profile.sub ? " \u00b7 " : ""}{profile.sub}</React.Fragment>
              ) : (
                <span style={{fontStyle:"italic"}}>Klik untuk isi nama & jabatan</span>
              )}
              <span className="edit-hint"> (edit)</span>
            </div>
          )}
        </div>
        <div className="bh-shapes" aria-hidden="true">
          <div className="bh-circle"></div>
          <div className="bh-square"></div>
          <div className="bh-triangle"></div>
        </div>
        <div className="date">{today.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
      </div>

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,marginBottom:8}}>
        <div className="cloud-badge" onClick={()=>{ if(window.confirm("Putuskan koneksi cloud di perangkat ini? Data di cloud tetap aman, cuma perlu disambungkan ulang lain kali.")) onDisconnect(); }} title="Klik untuk memutus/mengganti koneksi cloud di perangkat ini">
          <span className="cloud-dot"></span> Tersambung ke Cloud (Bin: {binId}) &middot; ubah koneksi
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <label htmlFor="backupFileInput" title="Upload file backup (.json) dari tracker versi/device lain untuk digabung ke Cloud ini"
            style={{background:"var(--paper-raise)",color:"var(--ink)",border:"2.5px solid var(--ink)",padding:"9px 14px",fontFamily:"var(--sans)",fontWeight:800,fontSize:11,letterSpacing:0.4,cursor:"pointer",textTransform:"uppercase",display:"inline-flex",alignItems:"center"}}>
            {backupFileBusy ? "Memproses..." : "\u2191 Restore dari Backup"}
          </label>
          <input ref={backupFileInputRef} id="backupFileInput" type="file" accept=".json,application/json,text/plain" style={{display:"none"}}
            onChange={e=>{ const f = e.target.files && e.target.files[0]; if(f) importFromBackupFile(f); }} disabled={backupFileBusy} />
          <button onClick={downloadCloudBackup} disabled={downloadBackupBusy}
            style={{background:"var(--yellow)",color:"var(--ink)",border:"2.5px solid var(--ink)",padding:"9px 14px",fontFamily:"var(--sans)",fontWeight:800,fontSize:11,letterSpacing:0.4,cursor:"pointer",textTransform:"uppercase"}}>
            {downloadBackupBusy ? "Menyiapkan..." : "\u2913 Backup Data Cloud (JSON)"}
          </button>
          <button onClick={checkCloudRaw} disabled={debugBusy}
            style={{background:"var(--paper-raise)",color:"var(--ink)",border:"2.5px dashed var(--muted)",padding:"9px 14px",fontFamily:"var(--sans)",fontWeight:800,fontSize:11,letterSpacing:0.4,cursor:"pointer",textTransform:"uppercase"}}>
            {debugBusy ? "Mengecek..." : "\u2139 Cek Isi Cloud Sekarang"}
          </button>
        </div>
      </div>
      {debugErr && <div style={{color:"var(--red)",fontSize:11.5,fontWeight:600,marginBottom:14}}>{debugErr}</div>}
      {debugResult && (
        <div style={{border:"2.5px solid var(--ink)",background:"#EAE2CC",padding:14,marginBottom:16,fontFamily:"var(--sans)",fontSize:12}}>
          <div style={{fontWeight:800,marginBottom:8}}>Isi Cloud saat ini (dicek jam {debugResult.checkedAt}) — {debugResult.totalKeys} key ditemukan:</div>
          {debugResult.totalKeys===0 ? (
            <div style={{color:"var(--red)",fontWeight:700}}>KOSONG TOTAL — tidak ada satu key pun di bin ini.</div>
          ) : (
            <table style={{width:"100%",borderCollapse:"collapse"}}>
              <tbody>
                {debugResult.rows.map(r=>(
                  <tr key={r.key}>
                    <td style={{padding:"3px 8px 3px 0",borderBottom:"1px solid var(--line)",fontWeight:600}}>{r.key}</td>
                    <td style={{padding:"3px 0",borderBottom:"1px solid var(--line)"}}>{r.info}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}
      {downloadBackupErr && <div style={{color:"var(--red)",fontSize:11.5,fontWeight:600,marginBottom:14}}>{downloadBackupErr}</div>}
      {backupFileErr && <div style={{color:"var(--red)",fontSize:11.5,fontWeight:600,marginBottom:14}}>{backupFileErr}</div>}
      {backupFileDone && <div style={{color:"var(--green)",fontSize:11.5,fontWeight:600,marginBottom:14}}>Berhasil digabungkan dari file backup ke Cloud. Memuat ulang halaman...</div>}

      {legacyKeys.length>0 && !importDone && (
        <div className="import-banner">
          <div className="msg">
            Terdeteksi {legacyKeys.length} data dari versi tracker lokal (sebelum pakai Cloud) masih tersimpan di browser ini. Mau dipindahkan ke Cloud sekarang biar tidak perlu input ulang manual?
          </div>
          <div className="actions">
            <button className="icon-btn" onClick={importLegacyData} disabled={importBusy}>
              {importBusy ? "Memindahkan..." : "Import ke Cloud"}
            </button>
            <button className="icon-btn" onClick={()=>setLegacyKeys([])} disabled={importBusy}>Nanti Saja</button>
          </div>
          {importErr && <div style={{color:"var(--red)",fontSize:11.5,fontWeight:600,marginTop:8}}>{importErr}</div>}
        </div>
      )}
      {importDone && (
        <div className="import-banner" style={{background:"#DFF3E1"}}>
          <div className="msg">Berhasil dipindahkan ke Cloud. Memuat ulang halaman...</div>
        </div>
      )}

      <div className="maintabs">
        <div className={"maintab-btn"+(mainView==="input"?" on":"")} onClick={()=>setMainView("input")}>Input & Kuartal</div>
        <div className={"maintab-btn"+(mainView==="report"?" on":"")} onClick={()=>setMainView("report")}>Laporan Tahunan {year}</div>
        <div className={"maintab-btn"+(mainView==="quotation"?" on":"")} onClick={()=>setMainView("quotation")}>Buat Penawaran</div>
        <div className={"maintab-btn"+(mainView==="faq"?" on":"")} onClick={()=>setMainView("faq")}>Panduan</div>
      </div>

      {mainView==="input" && (
      <React.Fragment>
      <div className="year-row">
        <span>Tahun</span>
        <div className="year-btn" onClick={()=>setYear(y=>y-1)}>&#8249;</div>
        <div className="year-label">{year}</div>
        <div className="year-btn" onClick={()=>setYear(y=>y+1)}>&#8250;</div>
      </div>

      <div className="quarter-tabs">
        {quarters.map(q=>(
          <div key={q.id} className={"quarter-tab"+(qId===q.id?" on":"")} onClick={()=>setQId(q.id)}>
            {q.label}<span className="rng">{q.range}</span>
          </div>
        ))}
      </div>

      <div className="target-row">
        <span>Target visit kuartal ini:</span>
        <input type="number" min="0" value={target} onChange={e=>persistTargetForQ(qKey, Number(e.target.value)||0)} />
        <span>&middot; Periode {new Date(quarter.start).toLocaleDateString('id-ID',{day:'2-digit',month:'short'})} – {new Date(quarter.end).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}</span>
      </div>

      <div className="stat-row">
        <div className="stat"><div className="num">{visitCount}</div><div className="lbl">Visit tercatat</div></div>
        <div className="stat"><div className="num">{callCount}</div><div className="lbl">Call tercatat</div></div>
        <div className="stat"><div className="num">{remainingWorkdays}</div><div className="lbl">Hari kerja tersisa</div></div>
        <div className="stat"><div className="num">{paceNeeded.toFixed(1)}</div><div className="lbl">Visit/hari dibutuhkan</div></div>
      </div>

      <div className={paceClass}>{paceText}</div>

      {target>0 && (
        <React.Fragment>
          <div className="progress-track"><div className="progress-fill" style={{width:progressPct+"%"}}></div></div>
          <div className="progress-caption">
            <span>{visitCount} / {target} visit</span>
            <span>{progressPct}% tercapai</span>
          </div>
        </React.Fragment>
      )}

      <div className="top-actions">
        <button className="export-btn" onClick={exportQuarterToExcel}>Export {quarter.label} ke Excel</button>
      </div>

      <h2 className="section" style={{marginTop:0}}>Breakdown Per Bulan — {quarter.label}</h2>
      <div className="monthly-wrap">
        <div className="legend">
          <span><span className="dot visit"></span>Visit</span>
          <span><span className="dot call"></span>Call</span>
        </div>
        {monthlyBreakdown.months.map(m=>(
          <React.Fragment key={m.label}>
            <div className="month-row">
              <div className="mname">{m.label}</div>
              <div className="bar-track"><div className="bar-fill visit" style={{width:(m.mVisit/monthlyBreakdown.maxVal*100)+"%"}}></div></div>
              <div className="bar-track"><div className="bar-fill call" style={{width:(m.mCall/monthlyBreakdown.maxVal*100)+"%"}}></div></div>
              <div className="month-total">{m.mVisit}V / {m.mCall}C</div>
            </div>
          </React.Fragment>
        ))}
      </div>

      <h2 className="section">Odometer Harian — {quarter.label}</h2>
      <div className="logform">
        <div>
          <label>Tanggal</label>
          <input ref={odoDateRef} type="date" value={odoDate} onChange={e=>setOdoDate(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); jamPergiRef.current && jamPergiRef.current.focus(); } }} />
        </div>
        <div>
          <label>Jam Berangkat</label>
          <input ref={jamPergiRef} type="time" value={jamPergi} onChange={e=>setJamPergi(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); odoBeforeRef.current && odoBeforeRef.current.focus(); } }} />
        </div>
        <div>
          <label>Odometer Berangkat (km)</label>
          <input ref={odoBeforeRef} type="number" min="0" value={odoBefore} onChange={e=>setOdoBefore(e.target.value)} placeholder="mis. 12345"
            onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); bbmBeforeRef.current && bbmBeforeRef.current.focus(); } }} />
        </div>
        <div>
          <label>Bensin Berangkat</label>
          <select ref={bbmBeforeRef} value={bbmBefore} onChange={e=>setBbmBefore(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); jamPulangRef.current && jamPulangRef.current.focus(); } }}>
            <option value="">-</option>
            {BBM_LEVELS.map(lv=><option key={lv} value={lv}>{lv}</option>)}
          </select>
        </div>
        <div>
          <label>Jam Pulang</label>
          <input ref={jamPulangRef} type="time" value={jamPulang} onChange={e=>setJamPulang(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); odoAfterRef.current && odoAfterRef.current.focus(); } }} />
        </div>
        <div>
          <label>Odometer Pulang (km)</label>
          <input ref={odoAfterRef} type="number" min="0" value={odoAfter} onChange={e=>setOdoAfter(e.target.value)} placeholder="mis. 12400"
            onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); bbmAfterRef.current && bbmAfterRef.current.focus(); } }} />
        </div>
        <div className="full">
          <label>Bensin Pulang</label>
          <select ref={bbmAfterRef} value={bbmAfter} onChange={e=>setBbmAfter(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); odoSaveBtnRef.current && odoSaveBtnRef.current.focus(); } }}>
            <option value="">-</option>
            {BBM_LEVELS.map(lv=><option key={lv} value={lv}>{lv}</option>)}
          </select>
        </div>
      </div>
      <button ref={odoSaveBtnRef} className="add-btn" onClick={addOdoRecord}>Simpan Odometer</button>

      <div className="search-box" style={{marginTop:14, display:"flex", gap:8, alignItems:"flex-end"}}>
        <div style={{flex:1}}>
          <label>Cari Tanggal (format: 2026 / 2026-08 / 2026-08-13)</label>
          <input type="text" value={odoSearch} onChange={e=>setOdoSearch(e.target.value)} placeholder="cth. 2026-08 untuk bulan Agustus" />
        </div>
        {!odoSearchClean && (
          <button className="icon-btn" style={{padding:"9px 14px",marginBottom:1}} onClick={()=>setOdoExpanded(v=>!v)}>
            {odoExpanded ? "Ringkas (3 terakhir)" : "+ Lihat 31 hari terakhir"}
          </button>
        )}
      </div>

      <div className="entries" style={{marginTop:6, maxHeight: odoExpanded||odoSearchClean ? 460 : "none", overflowY: odoExpanded||odoSearchClean ? "auto" : "visible"}}>
        {!loaded ? (
          <div className="empty">Memuat data...</div>
        ) : odoRecordsDisplay.length===0 ? (
          <div className="empty">{odoSearchClean ? "Tidak ada catatan odometer yang cocok." : "Belum ada catatan odometer."}</div>
        ) : odoRecordsDisplay.map(r=>(
          editOdoId===r.id ? (
            <div className="edit-row-odo" key={r.id}>
              <div><label>Tanggal</label><input type="date" value={editOdoDate} onChange={e=>setEditOdoDate(e.target.value)} /></div>
              <div><label>Jam Berangkat</label><input type="time" value={editJamPergi} onChange={e=>setEditJamPergi(e.target.value)} /></div>
              <div><label>Odo Berangkat</label><input type="number" min="0" value={editOdoBefore} onChange={e=>setEditOdoBefore(e.target.value)} placeholder="km" /></div>
              <div>
                <label>Bensin Berangkat</label>
                <select value={editBbmBefore} onChange={e=>setEditBbmBefore(e.target.value)}>
                  <option value="">-</option>
                  {BBM_LEVELS.map(lv=><option key={lv} value={lv}>{lv}</option>)}
                </select>
              </div>
              <div><label>Jam Pulang</label><input type="time" value={editJamPulang} onChange={e=>setEditJamPulang(e.target.value)} /></div>
              <div><label>Odo Pulang</label><input type="number" min="0" value={editOdoAfter} onChange={e=>setEditOdoAfter(e.target.value)} placeholder="km" /></div>
              <div>
                <label>Bensin Pulang</label>
                <select value={editBbmAfter} onChange={e=>setEditBbmAfter(e.target.value)}>
                  <option value="">-</option>
                  {BBM_LEVELS.map(lv=><option key={lv} value={lv}>{lv}</option>)}
                </select>
              </div>
              <div className="actions">
                <button className="icon-btn" onClick={()=>saveEditOdo(r.id)}>Simpan</button>
                <button className="icon-btn" onClick={cancelEditOdo}>Batal</button>
              </div>
            </div>
          ) : (
            <div className="entry" key={r.id}>
              <span className="date" style={{flexShrink:0}}>{new Date(r.date).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}</span>
              <span className="name">
                Berangkat: {r.jamPergi||"?"} / {r.before!=null?r.before:"?"} km / {r.bbmBefore||"?"}
                <span className="meta"> — Pulang: {r.jamPulang||"?"} / {r.after!=null?r.after:"?"} km / {r.bbmAfter||"?"}</span>
                {(r.before!=null&&r.after!=null&&r.after>=r.before) && <span className="meta"> — jarak {r.after-r.before} km</span>}
              </span>
              <span className="icon-btn" style={{fontSize:11,padding:"3px 8px"}} onClick={()=>startEditOdo(r)}>Edit</span>

            <h3>Bagaimana cara kerja tracker ini?</h3>
            <p>Semua data (Visit, Call, Penjualan, Odometer) langsung tersimpan otomatis ke Cloud setiap kali disimpan — tidak perlu tombol "save" terpisah, dan tidak perlu backup manual untuk pemakaian sehari-hari. Bisa dibuka dari HP, PC, atau perangkat mana saja, asal tersambung ke Cloud yang sama.</p>

          </div>

          <div className="faq-item">
            <h3>Apa bedanya "Backup Data Cloud" dan data yang otomatis tersimpan?</h3>
            <p>Data yang diinput sehari-hari sudah otomatis aman di Cloud, real-time, tanpa perlu backup. Tombol <strong>"Backup Data Cloud (JSON)"</strong> itu cadangan tambahan — semacam "foto" kondisi data di tanggal itu, disimpan sebagai file di perangkat. Berguna kalau suatu saat ada masalah teknis dan perlu memulihkan data. Disarankan diklik sesekali (misal akhir bulan) dan disimpan filenya di Google Drive.</p>

          <div className="faq-item">
            <h3>Kenapa data Visit/Call/Odometer/Penjualan kadang "nyangkut" di kuartal yang salah?</h3>

          <div className="faq-item">
            <h3>Bagaimana cara isi Rincian Part di Data Penjualan?</h3>
            <p>Saat input/edit Data Penjualan, ada bagian "Rincian Part yang Terjual" — klik "+ Tambah Part" untuk menambah baris, isi No. Part, Nama Part (opsional), Qty, dan Harga Satuan (harga per pcs sebelum diskon, sama seperti kolom "UNIT PRICE" di quotation). Bisa lebih dari satu part per transaksi. Ini dipakai untuk laporan "Part Paling Banyak Terjual" dan tidak wajib diisi kalau tidak diperlukan. Kalau upload PDF quotation, rincian part ini akan coba dibaca otomatis dari tabel di PDF-nya.</p>
          </div>

          <div className="faq-item">
            <h3>Di mana lihat ranking customer paling aktif?</h3>
            <p>Buka tab <strong>"Laporan Tahunan"</strong>, scroll ke bagian bawah — ada tabel "Ranking Customer Paling Aktif Bertransaksi" (diurutkan dari jumlah transaksi terbanyak) dan "Part Paling Banyak Terjual" (diurutkan dari qty terbanyak).</p>
          </div>

          <div className="faq-item">
            <h3>Upload PDF PO/Quotation otomatis, akurat tidak?</h3>
            <p>Ini bantuan tebakan otomatis (nominal, no. dokumen, customer, tanggal) berdasarkan pola teks yang umum dipakai. Selalu cek ulang hasilnya sebelum diklik Simpan, karena format tiap dokumen bisa berbeda-beda. File PDF itu sendiri tidak ikut tersimpan di tracker, hanya dipakai untuk membaca teksnya sekali saat upload.</p>
          </div>

          <div className="faq-item">
            <h3>Bagaimana cara membuat Penawaran (Quotation) dan kirim ke customer?</h3>
            <p>Buka tab <strong>"Buat Penawaran"</strong>. Cara paling cepat: klik <strong>"Upload PDF Penawaran Asli"</strong> dan pilih file PDF quotation yang sudah pernah terbit (dari sistem AIS atau format manual) — No. Dokumen, Tanggal, Customer, Alamat, Model, Serial Number, dan semua Rincian Part otomatis terisi. Atau isi manual: pilih format dulu (<strong>AIS System</strong> satu tabel, atau <strong>Manual BMP</strong> 3 bagian Spare Parts/Consumable/Service). Setelah terisi, klik <strong>"Simpan Penawaran"</strong> supaya masuk ke Riwayat Penawaran (bisa dicari & diedit lagi kapan saja), lalu <strong>"Export ke PDF"</strong> untuk mencetak — nanti muncul dialog print bawaan browser, pilih "Save as PDF", nama filenya otomatis mengikuti No. Dokumen.</p>
          </div>

          <div className="faq-item">
            <h3>Penawaran yang sudah dibuat, bisa dicari dan diedit lagi tidak?</h3>
            <p>Bisa. Setelah klik <strong>"Simpan Penawaran"</strong>, penawaran itu masuk ke daftar <strong>"Riwayat Penawaran"</strong> di bawah form (tersimpan per kuartal sesuai Tanggal Dokumennya). Ada kolom pencarian berdasarkan No. Dokumen atau nama Customer. Klik <strong>"Edit"</strong> pada salah satu penawaran untuk memuat ulang semua datanya ke form dan mengubahnya, lalu klik "Update Penawaran Tersimpan" untuk menyimpan perubahannya.</p>
          </div>

          <div className="faq-item">
            <h3>Apakah Part Number yang diketik di Buat Penawaran ikut tersimpan untuk rekomendasi berikutnya?</h3>
            <p>Ya. Setiap kali Penawaran disimpan, semua No. Part & Nama Part yang ada di dalamnya otomatis masuk ke "kamus part" global tracker — sama seperti part yang diketik lewat Data Penjualan. Kamus ini dipakai untuk menyarankan Nama Part & Harga otomatis saat membuat penawaran berikutnya untuk part yang sama.</p>
          </div>

          <div className="faq-item">
            <h3>Amankah kalau HP hilang atau tracker error?</h3>
            <p>Data utama aman di Cloud, tidak tersimpan di HP. Kalau HP hilang, tinggal buka tracker dari perangkat lain dan sambungkan dengan API Key + Bin ID yang sama. File backup .json adalah lapisan pengaman tambahan di luar itu.</p>
          </div>

          <div className="faq-item">
            <h3>Bisa dipakai untuk lebih dari satu tahun?</h3>
            <p>Bisa. Gunakan panah di sebelah "Tahun" untuk pindah ke tahun berikutnya. Data tersimpan terpisah per tahun dan kuartal, jadi tracker ini bisa terus dipakai untuk tahun-tahun mendatang tanpa data lama tertimpa.</p>
          </div>
        </React.Fragment>
      )}

      <div className="footnote">
        Gunakan panah di sebelah "Tahun" untuk pindah ke tahun berikutnya/sebelumnya, lalu pilih tab kuartal untuk mencatat dan memantau visit/call sesuai periodenya (data tersimpan terpisah per tahun dan kuartal, jadi tracker ini bisa terus dipakai untuk tahun-tahun berikutnya). Target per kuartal bisa diatur manual lewat kolom "Target visit kuartal ini", dan Target Penjualan Tahunan bisa diedit tiap tahun di tab "Laporan Tahunan". Hari kerja dihitung otomatis mengecualikan Sabtu-Minggu dan hari libur nasional; untuk tahun selain 2026, hanya tanggal merah fixed-date (1 Jan, 1 Mei, 17 Agt, 25 Des) yang otomatis terhitung — tanggal merah berbasis lunar/hijriah (Imlek, Idul Fitri, dll) perlu disesuaikan manual tiap tahun kalau diperlukan. Upload PDF PO/Quotation di bagian Data Penjualan akan mencoba menebak nominal, no. dokumen, customer, dan tanggal secara otomatis — hasilnya perlu dicek ulang sebelum disimpan, dan file PDF itu sendiri tidak ikut tersimpan di tracker ini. Daftar customer bersifat global untuk semua tahun dan kuartal. Klik nama/jabatan di pojok kiri atas untuk mengubah profil pengguna. Semua data tersimpan otomatis di perangkat ini.
      </div>

    </div>
  );
}

function SetupScreen({onConnected}){
  const [apiKey,setApiKey] = useState("");
  const [binId,setBinId] = useState("");
  const [status,setStatus] = useState(null); // {ok:bool, msg:string}
  const [testing,setTesting] = useState(false);
  const [newBinId,setNewBinId] = useState("");

  const testAndSave = async()=>{
    const key = apiKey.trim();
    const bin = binId.trim();
    if(!key){ setStatus({ok:false, msg:"API Key belum diisi."}); return; }
    setTesting(true); setStatus(null); setNewBinId("");
    try{
      if(bin){
        // Sudah punya Bin ID (device kedua dst) -> coba baca bin-nya buat pastikan cocok
        const res = await fetch("https://api.jsonbin.io/v3/b/" + bin + "/latest", {
          headers: { "X-Master-Key": key, "X-Bin-Meta": "false" }
        });
        if(!res.ok){
          const errData = await res.json().catch(()=>({}));
          throw new Error(errData.message || ("HTTP " + res.status));
        }
        window.__setCloudCfg(key, bin);
        setStatus({ok:true, msg:"Berhasil tersambung ke bin yang sudah ada! Mengalihkan..."});
        setTimeout(()=>onConnected(), 700);
      } else {
        // Belum punya Bin ID -> buat bin baru sekali ini aja
        const res = await fetch("https://api.jsonbin.io/v3/b", {
          method: "POST",
          headers: { "Content-Type":"application/json", "X-Master-Key": key, "X-Bin-Private":"true", "X-Bin-Name":"Tracker VCS DB" },
          body: JSON.stringify({ _tracker_db: true, _created: new Date().toISOString() })
        });
        if(!res.ok){
          const errData = await res.json().catch(()=>({}));
          throw new Error(errData.message || ("HTTP " + res.status));
        }
        const data = await res.json();
        const createdId = data && data.metadata && data.metadata.id;
        if(!createdId) throw new Error("Bin ID tidak ditemukan di respons.");
        window.__setCloudCfg(key, createdId);
        setNewBinId(createdId);
        setStatus({ok:true, msg:"Bin baru berhasil dibuat & tersambung! Catat Bin ID di bawah ini sebelum lanjut."});
      }
    }catch(e){
      setStatus({ok:false, msg:"Gagal tersambung. Detail: " + (e && e.message ? e.message : String(e))});
    }finally{
      setTesting(false);
    }
  };

  return (
    <div className="setup-wrap">
      <div className="setup-card">
        <h1>Hubungkan Tracker ke Cloud</h1>
        <p>Supaya data bisa diinput dari HP, PC, atau perangkat mana saja dan tetap sinkron, tracker ini disambungkan ke satu penyimpanan online lewat JSONBin.io. Semua langkahnya bisa dilakukan dari HP, tidak perlu buka editor kode apapun.</p>
        <ol>
          <li>Buka <strong>jsonbin.io</strong> di browser HP, klik <strong>Create Account</strong> (bisa pakai email biasa).</li>
          <li>Setelah masuk, buka menu <strong>API Keys</strong>, salin <strong>X-MASTER-KEY</strong> yang muncul di situ.</li>
          <li>Tempel API Key itu di kolom pertama bawah ini.</li>
          <li>Kalau ini perangkat <strong>pertama kali</strong> setup, kosongkan kolom Bin ID lalu klik tombol di bawah &mdash; sistem akan buatkan tempat penyimpanan baru otomatis.</li>
          <li>Kalau ini perangkat <strong>kedua dst</strong> (mis. sudah setup di HP, sekarang di PC), isi juga kolom Bin ID dengan ID yang sudah dicatat sebelumnya, biar nyambung ke data yang sama.</li>
        </ol>
        <input type="text" placeholder="X-Master-Key dari jsonbin.io" value={apiKey} onChange={e=>setApiKey(e.target.value)} />
        <input type="text" placeholder="Bin ID (kosongkan kalau baru pertama kali setup)" value={binId} onChange={e=>setBinId(e.target.value)} />
        <button className="add-btn" style={{marginTop:0}} onClick={testAndSave} disabled={testing}>
          {testing ? "Menguji koneksi..." : "Uji & Simpan Koneksi"}
        </button>
        {status && <div className={"setup-status "+(status.ok?"ok":"bad")}>{status.msg}</div>}
        {newBinId && (
          <div style={{marginTop:14}}>
            <label style={{fontFamily:"var(--sans)",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5,color:"var(--muted)"}}>Bin ID (catat ini untuk sambungkan device lain)</label>
            <input type="text" readOnly value={newBinId} onFocus={e=>e.target.select()} style={{marginTop:6,fontWeight:700}} />
            <button className="icon-btn" style={{marginTop:8}} onClick={()=>onConnected()}>Lanjut ke Tracker &rarr;</button>
          </div>
        )}
      </div>
    </div>
  );
}

function App(){
  const [cloudCfg,setCloudCfgState] = useState(window.__getCloudCfg ? window.__getCloudCfg() : {apiKey:"",binId:""});
  const isConnected = !!(cloudCfg.apiKey && cloudCfg.binId);
  if(!isConnected){
    return <SetupScreen onConnected={()=>setCloudCfgState(window.__getCloudCfg())} />;
  }
  return <MainApp onDisconnect={()=>{ window.__clearCloudCfg(); setCloudCfgState({apiKey:"",binId:""}); }} binId={cloudCfg.binId} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
