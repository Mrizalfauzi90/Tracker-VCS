<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker VCS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15130F; --paper:#F2EDE1; --paper-raise:#FFFFFF; --line:#D9D0BA;
    --red:#C4272B; --blue:#0E3C74; --yellow:#EFB215; --green:#2E6B44; --muted:#7C7460;
    --disp:'Archivo Black', 'Arial Black', sans-serif;
    --sans:'Space Grotesk', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  *:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
  body{margin:0;background:var(--paper);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:840px;margin:0 auto;padding:32px 22px 70px;}

  /* ---- Masthead + signature shape trio ---- */
  .masthead{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:5px solid var(--ink);padding-bottom:16px;margin-bottom:24px;}
  .masthead h1{font-family:var(--disp);font-size:30px;margin:0;font-weight:400;letter-spacing:0.5px;line-height:1;}
  .masthead .sub{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:8px;}
  .sub-clickable{cursor:pointer;display:inline-block;padding:3px 6px;margin-left:-6px;border:1.5px dashed transparent;transition:border-color .15s ease,background .15s ease;}
  .sub-clickable:hover{border-color:var(--muted);background:#EAE2CC;}
  .edit-hint{font-size:9px;letter-spacing:1px;color:var(--muted);opacity:0;transition:opacity .15s ease;text-transform:none;font-weight:500;}
  .sub-clickable:hover .edit-hint{opacity:1;}
  .profile-edit{display:flex;flex-direction:column;gap:6px;margin-top:6px;max-width:320px;}
  .profile-edit input{padding:8px 10px;border:2px solid var(--ink);font-family:var(--sans);font-weight:500;font-size:12.5px;background:var(--paper-raise);}
  .profile-edit-actions{display:flex;gap:6px;margin-top:2px;}
  .masthead .date{font-family:var(--sans);font-weight:600;font-size:12px;color:var(--muted);text-align:right;flex-shrink:0;}
  .bh-shapes{display:flex;align-items:center;gap:9px;flex-shrink:0;margin:0 4px;}
  .bh-circle{width:20px;height:20px;border-radius:50%;background:var(--blue);}
  .bh-square{width:18px;height:18px;background:var(--red);}
  .bh-triangle{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:17px solid var(--yellow);}
  @media (max-width:560px){ .bh-shapes{display:none;} }

  /* ---- Year / quarter navigation ---- */
  .year-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-family:var(--sans);}
  .year-row > span{font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;}
  .year-btn{width:34px;height:34px;border:2.5px solid var(--ink);background:var(--paper-raise);cursor:pointer;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease;}
  .year-btn:hover{background:var(--ink);color:var(--paper-raise);}
  .year-label{font-family:var(--disp);font-size:20px;font-weight:400;min-width:64px;text-align:center;}
  .quarter-tabs{display:flex;gap:0;margin-bottom:22px;border:2.5px solid var(--ink);}
  .quarter-tab{flex:1;padding:12px 4px;text-align:center;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:0.5px;background:var(--paper-raise);border-right:2.5px solid var(--ink);transition:background .15s ease,color .15s ease;}
  .quarter-tab:last-child{border-right:none;}
  .quarter-tab:hover{background:#EAE2CC;}
  .quarter-tab.on{background:var(--red);color:#fff;}
  .quarter-tab.on:hover{background:var(--red);}
  .quarter-tab .rng{display:block;font-weight:500;font-size:9.5px;color:var(--muted);margin-top:3px;text-transform:none;letter-spacing:0;}
  .quarter-tab.on .rng{color:#f6d9d5;}

  /* ---- Target + stats ---- */
  .target-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-family:var(--sans);font-size:12.5px;margin-bottom:20px;color:var(--muted);font-weight:500;}
  .target-row input{width:84px;padding:7px 9px;border:2.5px solid var(--ink);font-family:var(--sans);font-weight:700;font-size:13px;background:var(--paper-raise);}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:2.5px;background:var(--ink);margin-bottom:18px;border:2.5px solid var(--ink);}
  .stat{background:var(--paper-raise);padding:16px 8px;text-align:center;}
  .stat:nth-child(1){background:#FBEAE9;}
  .stat:nth-child(2){background:#E7EEF6;}
  .stat .num{font-family:var(--disp);font-size:26px;font-weight:400;line-height:1;}
  .stat .lbl{font-family:var(--sans);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;color:var(--muted);margin-top:8px;}

  .pace-banner{font-family:var(--sans);font-weight:500;font-size:13px;padding:12px 15px;margin-bottom:20px;border:2.5px solid var(--ink);border-left-width:9px;background:var(--paper-raise);}
  .pace-banner.behind{border-left-color:var(--red);}
  .pace-banner.ontrack{border-left-color:var(--green);}
  .pace-banner.closed{border-left-color:var(--muted);}
  .progress-track{height:14px;background:var(--paper-raise);border:2.5px solid var(--ink);margin-bottom:7px;overflow:hidden;}
  .progress-fill{height:100%;background:repeating-linear-gradient(135deg,var(--yellow),var(--yellow) 10px,#e0a30f 10px,#e0a30f 20px);transition:width .4s ease;}
  .progress-caption{font-family:var(--sans);font-weight:600;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:24px;}

  h2.section{font-family:var(--sans);font-size:14px;text-transform:uppercase;letter-spacing:1.6px;border-bottom:3px solid var(--ink);padding-bottom:8px;margin:38px 0 16px;font-weight:700;}
  h2.section:first-of-type{margin-top:0;}

  .tabs{display:flex;gap:0;margin-bottom:18px;border:2.5px solid var(--ink);width:fit-content;}
  .tab-btn{padding:10px 20px;cursor:pointer;font-family:var(--sans);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;background:var(--paper-raise);transition:background .15s ease,color .15s ease;}
  .tab-btn:hover{background:#EAE2CC;}
  .tab-btn.on{background:var(--ink);color:#fff;}
  .tab-btn.on:hover{background:var(--ink);}

  .logform{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px;}
  @media (max-width:480px){ .logform{grid-template-columns:1fr;} }
  .logform .full{grid-column:1/-1;}
  label{font-family:var(--sans);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);display:block;margin-bottom:5px;}
  select,input[type=date],input[type=time],input[type=text],input[type=tel],input[type=number]{
    width:100%;padding:11px 12px;border:2.5px solid var(--ink);background:var(--paper-raise);
    font-family:var(--sans);font-weight:500;font-size:13.5px;color:var(--ink);transition:box-shadow .15s ease;
  }
  select:focus,input:focus{box-shadow:3px 3px 0 var(--yellow);}
  select{cursor:pointer;}

  .type-toggle{display:flex;gap:10px;}
  .type-btn{flex:1;padding:11px 0;text-align:center;border:2.5px solid var(--ink);cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:700;background:var(--paper-raise);transition:background .15s ease,color .15s ease;}
  .type-btn.active-call{background:var(--blue);color:#fff;border-color:var(--blue);}
  .type-btn.active-visit{background:var(--red);color:#fff;border-color:var(--red);}

  .add-btn{margin-top:14px;width:100%;padding:14px;background:var(--ink);color:#fff;border:2.5px solid var(--ink);font-family:var(--sans);font-weight:700;font-size:13px;letter-spacing:1px;cursor:pointer;text-transform:uppercase;transition:background .15s ease,transform .1s ease;}
  .add-btn:hover{background:var(--red);border-color:var(--red);}
  .add-btn:active{transform:translateY(1px);}

  .export-btn{background:var(--blue);color:#fff;border:2.5px solid var(--blue);padding:11px 18px;font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:0.7px;cursor:pointer;text-transform:uppercase;transition:background .15s ease;}
  .export-btn:hover{background:var(--ink);border-color:var(--ink);}
  .top-actions{display:flex;justify-content:flex-end;margin-bottom:12px;}

  .entries{margin-top:8px;}
  .entries::-webkit-scrollbar{width:9px;}
  .entries::-webkit-scrollbar-track{background:var(--paper);}
  .entries::-webkit-scrollbar-thumb{background:var(--ink);}
  .entry{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:2px solid var(--line);font-family:var(--sans);}
  .entry .tag{font-size:9.5px;font-weight:700;padding:4px 8px;text-transform:uppercase;letter-spacing:0.6px;flex-shrink:0;color:#fff;}
  .tag.visit{background:var(--red);}
  .tag.call{background:var(--blue);}
  .entry .name{flex:1;font-size:13.5px;font-weight:500;}
  .entry .meta{color:var(--muted);font-size:12px;}
  .entry .date{font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0;text-transform:uppercase;}
  .entry .del{cursor:pointer;color:var(--muted);font-size:19px;line-height:1;padding:2px 6px;flex-shrink:0;transition:color .15s ease;}
  .entry .del:hover{color:var(--red);}
  .empty{font-family:var(--sans);font-weight:500;font-size:13px;color:var(--muted);padding:26px 0;text-align:center;font-style:italic;}

  .cust-row{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:2px solid var(--line);font-family:var(--sans);}
  .cust-row .cname{flex:1;font-size:13.5px;font-weight:500;}
  .cust-row .cmeta{color:var(--muted);font-size:11.5px;}
  .cust-actions{display:flex;gap:7px;flex-shrink:0;}
  .icon-btn{cursor:pointer;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink);border:2px solid var(--ink);padding:6px 11px;background:var(--paper-raise);transition:background .15s ease,color .15s ease;}
  .icon-btn:hover{background:var(--ink);color:#fff;}
  .icon-btn.danger:hover{background:var(--red);border-color:var(--red);color:#fff;}
  .edit-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;padding:12px 4px;border-bottom:2px solid var(--line);align-items:end;background:#EAE2CC;}
  .edit-row-odo{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 14px;padding:14px 4px;border-bottom:2px solid var(--line);align-items:end;background:#EAE2CC;}
  .edit-row-odo input,.edit-row-odo select{min-width:0;}
  .edit-row-odo .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:2px;}
  @media (min-width:600px){ .edit-row-odo{grid-template-columns:repeat(4,1fr);} }
  .search-box{margin-bottom:12px;}
  .search-box label{margin-bottom:5px;}

  .monthly-wrap{margin-bottom:26px;}
  .month-row{display:grid;grid-template-columns:60px 1fr 1fr 56px;gap:10px;align-items:center;padding:8px 0;font-family:var(--sans);font-size:12px;}
  .month-row .mname{font-weight:700;text-transform:uppercase;letter-spacing:0.4px;font-size:11px;}
  .bar-track{height:18px;background:var(--paper-raise);border:2px solid var(--ink);overflow:hidden;position:relative;}
  .bar-fill{height:100%;}
  .bar-fill.visit{background:var(--red);}
  .bar-fill.call{background:var(--blue);}
  .month-total{text-align:right;color:var(--muted);font-weight:600;font-size:11px;}
  .legend{display:flex;gap:18px;font-family:var(--sans);font-weight:600;font-size:11px;color:var(--muted);margin-bottom:12px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend .dot{width:11px;height:11px;display:inline-block;}
  .legend .dot.visit{background:var(--red);border-radius:50%;}
  .legend .dot.call{width:0;height:0;background:transparent;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--blue);}

  .bar-fill.newp{background:var(--yellow);}
  .bar-fill.oldc{background:var(--green);}
  .bar-fill.sales{background:var(--blue);}

  .maintabs{display:flex;flex-wrap:wrap;gap:0;margin-bottom:20px;border:2.5px solid var(--ink);}
  .greeting-bar{font-family:var(--sans);font-weight:700;font-size:13px;color:var(--ink);background:var(--paper-raise);border:2px solid var(--ink);padding:8px 14px;margin:-10px 0 16px;display:inline-block;}
  .wrap.has-bg > .greeting-bar{background:rgba(255,255,255,var(--bubble,.92));}
  .maintab-btn{flex:1 1 auto;padding:12px 8px;text-align:center;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:0.5px;background:var(--paper-raise);text-transform:uppercase;transition:background .15s ease,color .15s ease;}
  .maintab-btn:hover{background:#EAE2CC;}
  .maintab-btn.on{background:var(--ink);color:#fff;}

  .report-card-row{display:grid;grid-template-columns:repeat(2,1fr);gap:2.5px;background:var(--ink);margin-bottom:22px;border:2.5px solid var(--ink);}
  @media (min-width:520px){ .report-card-row{grid-template-columns:repeat(4,1fr);} }
  .report-card{background:var(--paper-raise);padding:16px 10px;text-align:center;}
  .report-card .num{font-family:var(--disp);font-size:22px;font-weight:400;line-height:1.1;word-break:break-word;}
  .report-card .lbl{font-family:var(--sans);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-top:8px;}

  .sales-target-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-family:var(--sans);font-size:12.5px;margin-bottom:16px;color:var(--muted);font-weight:500;}
  .sales-target-row input{width:170px;padding:7px 9px;border:2.5px solid var(--ink);font-family:var(--sans);font-weight:700;font-size:13px;background:var(--paper-raise);}

  .upload-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .upload-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;background:var(--paper-raise);border:2.5px dashed var(--ink);font-family:var(--sans);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;transition:background .15s ease;}
  .upload-btn:hover{background:#EAE2CC;}
  .upload-status{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:600;}
  .extract-note{font-family:var(--sans);font-size:11.5px;color:var(--muted);font-style:italic;margin-bottom:12px;line-height:1.5;}

  .parts-section{border:2px dashed var(--muted);padding:12px;margin-bottom:16px;background:#EAE2CC;}
  .parts-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .parts-header label{font-family:var(--sans);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);}
  .part-row{display:grid;grid-template-columns:1.1fr 1.2fr 60px 110px auto;gap:8px;margin-bottom:8px;align-items:center;}
  .part-row input{padding:9px 10px;border:2px solid var(--ink);font-family:var(--sans);font-size:12.5px;background:var(--paper-raise);}
  .price-hint{font-family:var(--sans);font-size:10.5px;color:var(--green);font-weight:700;font-style:italic;}
  @media (max-width:640px){
    .part-row{grid-template-columns:1fr !important;gap:8px;}
    .part-row input, .part-row select{width:100%;box-sizing:border-box;}
    .part-row span.del{justify-self:end;margin-top:-2px;padding:4px 10px;}
  }

  .setup-wrap{max-width:520px;margin:60px auto;padding:0 20px;}
  .setup-card{border:2.5px solid var(--ink);background:var(--paper-raise);padding:28px 24px;}
  .setup-card h1{font-family:var(--disp);font-size:24px;font-weight:400;margin:0 0 6px;}
  .setup-card p{font-family:var(--sans);font-size:13px;color:var(--muted);line-height:1.7;margin:0 0 16px;}
  .setup-card ol{font-family:var(--sans);font-size:12.5px;color:var(--ink);line-height:1.9;padding-left:20px;margin:0 0 18px;}
  .setup-card input{width:100%;padding:12px;border:2.5px solid var(--ink);font-family:var(--sans);font-weight:500;font-size:13px;margin-bottom:12px;}
  .setup-status{font-family:var(--sans);font-size:12.5px;font-weight:600;margin-top:10px;}
  .setup-status.ok{color:var(--green);}
  .setup-status.bad{color:var(--red);}
  .cloud-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:var(--muted);cursor:pointer;}
  .import-banner{border:2.5px solid var(--ink);background:#FFF3D6;padding:16px;margin-bottom:20px;font-family:var(--sans);}
  .import-banner .msg{font-size:12.5px;font-weight:600;line-height:1.6;margin-bottom:10px;}
  .import-banner .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .cloud-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}
  .cloud-dot.bad{background:var(--red);}
  .report-table{width:100%;border-collapse:collapse;margin-bottom:26px;font-family:var(--sans);font-size:12.5px;}
  .report-table th{background:var(--ink);color:#fff;text-align:left;padding:9px 10px;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:0.4px;}
  .report-table td{padding:8px 10px;border-bottom:1.5px solid var(--line);}
  .report-table tbody tr:nth-child(odd){background:#EAE2CC;}
  .faq-item{margin-bottom:22px;padding-bottom:18px;border-bottom:1.5px solid var(--line);}
  .faq-item h3{font-family:var(--disp);font-size:16px;font-weight:400;margin:0 0 8px;color:var(--ink);}
  .faq-item p{font-family:var(--sans);font-size:12.5px;color:var(--muted);line-height:1.7;margin:0;}

  .quo-doc{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:11px;padding:24px;border:1px solid #999;width:800px;max-width:800px;margin:0 auto;line-height:1.5;position:relative;isolation:isolate;}
  /* Watermark logo tipis: di layar 1x di tengah dokumen, saat cetak/PDF diulang di setiap halaman */
  .quo-watermark{position:absolute;top:50%;left:50%;width:420px;height:420px;margin:-210px 0 0 -210px;opacity:.07;z-index:-1;pointer-events:none;object-fit:contain;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .quo-sign-img{display:block;height:54px;max-width:190px;object-fit:contain;mix-blend-mode:multiply;}
  .quo-sign-space{height:44px;display:flex;align-items:flex-end;justify-content:center;}
  .quo-manual-sign-space{height:58px;display:flex;align-items:flex-end;justify-content:flex-start;}
  .signer-card{border:2.5px solid var(--ink);background:var(--paper-raise);padding:16px;margin-bottom:20px;}
  /* Bubble: kalau menu punya background gambar, tiap blok isi dialasi kotak semi-solid supaya tulisan tetap jelas */
  .wrap.has-bg > *:not(.help-overlay):not(.maintabs):not(.add-btn):not(button){background:rgba(250,246,236,var(--bubble,.92));border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.22);margin-bottom:14px !important;}
  .wrap.has-bg > *:not(.help-overlay):not(.maintabs):not(.signer-card):not(.add-btn):not(button){padding:12px 16px;}
  .wrap.has-bg > .signer-card{background:rgba(255,255,255,var(--bubble,.92));}
  .wrap.has-bg > .add-btn{box-shadow:0 2px 12px rgba(0,0,0,.32);}
  .wrap.has-bg > .maintabs{box-shadow:0 2px 12px rgba(0,0,0,.22);}
  .bg-quick{display:flex;justify-content:flex-end;gap:6px;margin:-10px 0 14px;}
  .bg-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1.5px solid var(--line);}
  .bg-thumb{width:64px;height:40px;flex-shrink:0;border:2px solid var(--ink);background:#EAE2CC center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);font-family:var(--sans);}
  .help-q{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:8px;border-radius:50%;border:2px solid var(--blue);color:var(--blue);background:#fff;font-family:var(--sans);font-weight:800;font-size:12px;line-height:1;cursor:pointer;vertical-align:middle;user-select:none;}
  .help-q:hover{background:var(--blue);color:#fff;}
  .help-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;}
  .help-box{background:#fff;border:2.5px solid var(--ink);max-width:520px;width:100%;max-height:82vh;overflow:auto;box-shadow:6px 6px 0 var(--ink);font-family:var(--sans);}
  .help-title{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;position:sticky;top:0;}

<script>
// Cloud storage: talks to JSONBin.io (satu "bin" JSON dipakai sebagai database sederhana)
// sehingga data bisa diinput dari HP, PC, atau perangkat mana saja dan tetap sinkron,
// dan proses setup-nya cukup lewat form di browser (tidak perlu buka editor kode apapun).
function getCloudCfg(){
  try{
    return {
      apiKey: localStorage.getItem("tracker_jsonbin_key") || "",
      binId: localStorage.getItem("tracker_jsonbin_bin") || ""
    };
  }catch(e){ return {apiKey:"", binId:""}; }
}
function setCloudCfg(apiKey, binId){
  try{
    localStorage.setItem("tracker_jsonbin_key", apiKey);
    localStorage.setItem("tracker_jsonbin_bin", binId);
  }catch(e){}
}
function clearCloudCfg(){
  try{
    localStorage.removeItem("tracker_jsonbin_key");
    localStorage.removeItem("tracker_jsonbin_bin");
  }catch(e){}
}
window.__getCloudCfg = getCloudCfg;
window.__setCloudCfg = setCloudCfg;
window.__clearCloudCfg = clearCloudCfg;

var GIST_FILE = "tracker.json";
function __gistHeaders(tok){ return { "Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json" }; }
function jsonbinReadAll(){
  var cfg = getCloudCfg();
  if(!cfg.apiKey || !cfg.binId) return Promise.reject(new Error("Cloud belum terhubung"));
  return fetch("https://api.github.com/gists/" + cfg.binId + "?t=" + Date.now(), {
    headers: __gistHeaders(cfg.apiKey), cache: "no-store"
  }).then(function(r){
    if(!r.ok) return __jsonbinFail(r);
    return r.json();
  }).then(function(g){
    var f = g.files && g.files[GIST_FILE];
    if(!f) return "{}";
    if(f.truncated && f.raw_url) return fetch(f.raw_url, {cache:"no-store"}).then(function(r){ return r.text(); });
    return f.content || "{}";
  }).then(function(t){
    __reportCloudSize(t);
    var data = JSON.parse(t);
    return data || {};
  });
}
function jsonbinWriteAll(dataObj){
  var cfg = getCloudCfg();
  if(!cfg.apiKey || !cfg.binId) return Promise.reject(new Error("Cloud belum terhubung"));
  // Kunci koneksi tidak boleh ikut tersimpan di data Cloud / file backup
  delete dataObj["jsonbin_key"]; delete dataObj["jsonbin_bin"];
  var body = JSON.stringify(dataObj);
  var payload = { files: {} }; payload.files[GIST_FILE] = { content: body };
  return fetch("https://api.github.com/gists/" + cfg.binId, {
    method: "PATCH",
    headers: Object.assign({ "Content-Type": "application/json" }, __gistHeaders(cfg.apiKey)),
    body: JSON.stringify(payload)
  }).then(function(r){
    if(!r.ok) return __jsonbinFail(r, body);
    __reportCloudSize(body);
    return r.json();
  });
}
// Ukuran data Cloud (KB) dilaporkan ke tampilan. JSONBin paket gratis menolak (HTTP 403) bin di atas 100 KB.
function __reportCloudSize(text){
  try{
    var n = (typeof Blob !== "undefined") ? new Blob([text]).size : String(text).length;
    window.__cloudBytes = n;
    window.dispatchEvent(new CustomEvent("cloudsize", {detail:{bytes:n}}));
  }catch(e){}
}
// Error dari JSONBin dibuat lebih jelas (alasan asli dari server + dugaan penyebab)
function __jsonbinFail(r, sentBody){
  return r.text().then(function(t){
    var msg = "";
    try{ msg = (JSON.parse(t).message || "").toString(); }catch(e){}
    var hint = "";
    if(r.status===401) hint = " (token GitHub salah/kedaluwarsa)";
    else if(r.status===403||r.status===429) hint = " (kemungkinan batas request GitHub tercapai, tunggu beberapa menit)";
    else if(r.status===404) hint = " (Gist ID salah, atau token tidak punya izin gist)";
    throw new Error("HTTP " + r.status + (msg ? " - " + msg : "") + hint);
  });
}
window.__jsonbinReadAll = jsonbinReadAll;
window.__jsonbinWriteAll = jsonbinWriteAll;

// Antrean: semua tulis/hapus dijalankan satu per satu. Tanpa ini, dua penyimpanan yang jalan bersamaan
// (mis. klik Deal = simpan penjualan + simpan status penawaran + simpan katalog) saling menimpa karena
// masing-masing membaca seluruh data lalu menulis ulang seluruhnya.
var __storageQueue = Promise.resolve();
function __enqueue(fn){
  var run = __storageQueue.then(function(){ return fn(); });
  __storageQueue = run.catch(function(){});
  return run;
}
window.storage = {
  get: function(key){
    return jsonbinReadAll().then(function(data){
      if(data && data[key] !== undefined && data[key] !== null && data[key] !== ""){
        return { key: key, value: data[key] };
      }
      throw new Error("not found");
    });
  },
  set: function(key, value){
    return __enqueue(function(){
      return jsonbinReadAll().catch(function(){ return {}; }).then(function(data){
        data[key] = value;
        return jsonbinWriteAll(data);
      }).then(function(){ return { key: key, value: value }; });
    });
  },
  delete: function(key){
    return __enqueue(function(){
      return jsonbinReadAll().catch(function(){ return {}; }).then(function(data){
        delete data[key];
        return jsonbinWriteAll(data);
      }).then(function(){ return { key: key, deleted: true }; });
    });
  },
  list: function(prefix){
    return jsonbinReadAll().then(function(data){
      var keys = Object.keys(data||{}).filter(function(k){ return !prefix || k.indexOf(prefix)===0; });
      return { keys: keys };
    });
  }
};

// Tanggal lokal "YYYY-MM-DD". toISOString() memakai UTC, jadi di WIB (UTC+7) jam 00:00-07:00 hasilnya masih kemarin.
function localISO(d){ const x = d || new Date(); return new Date(x.getTime() - x.getTimezoneOffset()*60000).toISOString().slice(0,10); }

const BERCA_BRANCHES_TOP = ["Cilegon","Jakarta","Cikarang"];
const BERCA_BRANCHES = ["Asem Reges","Balikpapan","Bandung","Banjarmasin","Batam","Batu Kajang","Benete","Bengalon","Bengkulu","Berau","Bitung","Cilacap","Denpasar","Jambi","Jatake","Kariangau","Kendari","Ketapang","Kupang","Lampung","Makassar","Manado","Medan","Melak","Morowali","Muara Enim","Padang","Palangkaraya","Palembang","Palu","Pangkal Pinang","Pekanbaru","Pontianak","Samarinda","Sampit","Sangatta","Satui","Semarang","Sorong","Surabaya","Tanjung Pinang","Tanjung Tabalong","Tarakan","Tembagapura","Waingapu"];
const INDENT_ORIGINS = ["China","Singapura","Jepang"];
const STOCK_DISCLAIMER = "Ketersediaan stock dapat berubah sewaktu-waktu.";
// Stock per baris = daftar lokasi: [{loc, detail, qty, days}]. loc = nama cabang | "INDENT" | "LAIN".
// Kompatibel dengan format lama (satu lokasi: stockLoc/stockDetail/stockDays).
function getStocks(r){
  if(r && Array.isArray(r.stocks)) return r.stocks;
  if(r && r.stockLoc) return [{loc:r.stockLoc, detail:r.stockDetail||"", qty:"", days:r.stockDays||""}];
  return [];
}
function cloneStocksNoQty(r){ return getStocks(r).filter(e=>e&&e.loc).map(e=>({loc:e.loc, detail:e.detail||"", qty:"", days:e.days||""})); }
// Contoh hasil: "Stock Cilegon: 3 pcs, Cikarang: 2 pcs; Indent Jepang: 2 pcs (est. tiba 30 hari)"
function stockText(r){
  const list = getStocks(r).filter(e=>e && e.loc);
  if(!list.length) return "";
  const fmt = (name, e)=>{
    const q = String(e.qty||"").replace(/\D/g,"");
    const d = String(e.days||"").replace(/\D/g,"");
    return name + (q ? ": "+q+" pcs" : "") + (d ? " (est. tiba "+d+" hari)" : "");
  };
  const branch = list.filter(e=>e.loc!=="INDENT" && e.loc!=="LAIN").map(e=>fmt(e.loc,e));
  const others = list.filter(e=>e.loc==="INDENT" || e.loc==="LAIN").map(e=>{
    const dt = String(e.detail||"").trim();
    const name = e.loc==="INDENT" ? "Indent"+(dt?" "+dt:"") : dt;
    return name ? fmt(name,e) : "";
  }).filter(Boolean);
  const segs = [];
  if(branch.length) segs.push("Stock "+branch.join(", "));
  others.forEach(o=>segs.push(o));
  return segs.join("; ");
}
// Jenis relasi nomor part di baris bawah: "replaces" (default, sesuai AIS: part ini BARU dan nomor tsb adalah Old P/N)
// atau "replacedBy" (part ini sudah di-SUPERSEDE, nomor tsb adalah New P/N). Teks label tampil di penawaran.
function supLabel(kind){ return kind==="replacedBy" ? "SUPERSEDE, diganti menjadi No. Part baru" : "PART NO. BARU, menggantikan No. Part lama"; }
function supNote(r){
  const pn = (r.desc||"").split(",")[0].trim();
  return r.supKind==="replacedBy"
    ? "- "+pn+" sudah di-supersede menjadi No. Part baru "+r.supersede
    : "- "+pn+" adalah No. Part baru, menggantikan No. Part lama "+r.supersede;
}
// Deteksi info supersede (pergantian part number) dari teks PDF AIS. Format persis di PDF belum dipastikan,
// jadi pola dibuat longgar: SUPERSEDE / SUPERSEDED / SUPERCEDE / SUPERSESSION / REPLACED / PENGGANTI + No. Part.
const SUPERSEDE_RE = /\b(?:SUPER[SC]ED(?:E|ED|ING)?|SUPERSESSION|REPLACED|REPLACEMENT|PENGGANTI)\b[\s:\-=>]*(?:(?:BY|TO|WITH|FROM)\b[\s:\-=>]*)?(?:PART\s*(?:NO\.?|NUMBER)?[\s:\-]*)?([A-Z0-9][A-Z0-9\-\.\/]{3,24})/i;
function extractSupersede(text){
  const m = String(text||"").match(SUPERSEDE_RE);
  if(m && /\d/.test(m[1])) return m[1].toUpperCase().replace(/[.\-\/]+$/,"");
  return "";
}
function pad2(n){ return n<10 ? "0"+n : ""+n; }

    const startD = `${year}-${pad2(t.mStart+1)}-01`;
    const endD = `${year}-${pad2(t.mEnd+1)}-${pad2(lastDayOfMonth(year,t.mEnd))}`;

      id:t.id,
      label:`${t.id} ${year}`,

function formatRupiah(n){
  if(n==null || isNaN(n)) return "Rp 0";
  return "Rp " + Math.round(n).toLocaleString("id-ID");
}
function parseIDNumber(str){
  str = (str||"").trim();
  const lastDot = str.lastIndexOf(".");
  const lastComma = str.lastIndexOf(",");
  const lastSep = Math.max(lastDot, lastComma);
  if(lastSep>-1 && str.length-lastSep-1===2){
    return Number(str.slice(0,lastSep).replace(/[.,]/g,""));
  }
  return Number(str.replace(/[.,]/g,""));
}
function extractDocNo(text){
  let m = text.match(/DOCUMENT\s*NO\.?\s*:?\s*([A-Z0-9][A-Z0-9.\-\/]{3,24})/i);
  if(m) return m[1].trim().toUpperCase();
  m = text.match(/\bPQ\s?\d{4,6}(?:\s*REV\.?\s*\d+)?\b/i);
  if(m) return m[0].replace(/\s+/g," ").trim().toUpperCase();
  m = text.match(/\bNO\.?\s*(?:PO|P\.?O\.?)\s*:?\s*([A-Z0-9.\-\/]{4,24})/i);
  if(m) return m[1].trim().toUpperCase();
  m = text.match(/\bPO\.?\s?(\d{6,})\b/i);
  if(m) return "PO"+m[1];
  m = text.match(/\bP\d{6,}\b/);
  if(m) return m[0].toUpperCase();
  return "";
}
// Parser gabungan buat baca quotation PDF (dipakai baik oleh Data Penjualan maupun Buat Penawaran)
function parseQuotationText(fullText){
  fullText = fullText.replace(/\bI\s*D\s*R\b/gi, "IDR");
  const lines = fullText.split("\n").map(l=>l.trim());

  let guessedNominal = null;
  const sectionTotals = [];
  for(let i=0;i<lines.length;i++){
    if(/^PPN\b/i.test(lines[i])){
      for(let j=i+1;j<Math.min(i+3,lines.length);j++){
        const m = lines[j].match(/Total\s*(?:Value)?\s*(?:IDR)?\s*([\d]{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?)/i);
        if(m){ sectionTotals.push(parseIDNumber(m[1])); break; }
      }
    }
  }
  if(sectionTotals.length){
    guessedNominal = sectionTotals.reduce((a,b)=>a+b,0);
  } else {
    const totalRegex = /\bTOTAL\b(?!\s*VALUE)[^\dRp\n]{0,10}(?:Rp\.?\s*)?([\d]{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?)/gi;
    const totalMatches = [...fullText.matchAll(totalRegex)];
    if(totalMatches.length){
      const nums = totalMatches.map(m=>parseIDNumber(m[1])).filter(n=>!isNaN(n)&&n>0);
      if(nums.length) guessedNominal = nums.reduce((a,b)=>a+b,0);
    }
  }
  if(!guessedNominal){
    const allNums = [...fullText.matchAll(/([\d]{1,3}(?:[.,]\d{3}){2,}(?:[.,]\d{1,2})?)/g)].map(m=>m[1]);
    const parsed = allNums.map(parseIDNumber).filter(n=>!isNaN(n)&&n>0);
    if(parsed.length) guessedNominal = Math.max(...parsed);
  }

  const guessedDocNo = extractDocNo(fullText);
  let guessedPpn = null;
  { const amt = (re)=>{ const m = fullText.match(re); return m ? parseIDNumber(m[1]) : null; };
    const total1 = amt(/Total Value[ \t]*IDR[ \t]*([0-9.,]+)/i);
    const discAmt = amt(/\bDisc[^\n]*?IDR[ \t]*([0-9.,]+)/i);
    const ppnAmt = amt(/\bPPN[ \t]*(?:[0-9.,]+[ \t]*%)?[ \t]*IDR[ \t]*([0-9.,]+)/i);
    if(total1 && ppnAmt){
      const base = total1 - (discAmt||0);
      if(base>0){ const pct = ppnAmt/base*100, r = Math.round(pct); if(Math.abs(pct-r)<0.35 && r>0 && r<=30) guessedPpn = r; }
    } }
  let guessedDisc = null;
  { const dm = fullText.match(/\bDISC(?:OUNT)?\.?[ \t]*([0-9]+(?:[.,][0-9]+)?)[ \t]*%/i);
    if(dm){ const dv = parseFloat(dm[1].replace(",",".")); if(isFinite(dv) && dv>=0 && dv<=100) guessedDisc = dv; } }

  let guessedType = "Quotation";
  if(/QUOTATION/i.test(lines.slice(0,3).join(" "))) guessedType = "Quotation";
  else if(/\bP\.?O\.?\b|\bPURCHASE ORDER\b/i.test(fullText)) guessedType = "PO";
  else if(/QUOTATION/i.test(fullText)) guessedType = "Quotation";

  let guessedCustomer = "";
  const custMatch = fullText.match(/CUSTOMER\s*:?\s*([A-Z0-9.,'&\-\s]{5,60}?)(?=\n|ADDRESS|ATTN|REMARKS|MERK|DOC|$)/i);
  if(custMatch) guessedCustomer = custMatch[1].trim().replace(/\s{2,}/g," ").replace(/^[A-Z]\d{3,6}\s*-\s*/i,"");

  let guessedAddress = "";
  const LABELS_RE = /\b(?:PHONE|N\.P\.W\.P|DEL\.ADDR|MODEL|REMARKS|FAX|CURR|MERK|DOCUMENT|SERIAL)\b/i;
  const addrLineIdx = lines.findIndex(l=>/^ADDRESS\s*:?/i.test(l));
  if(addrLineIdx>-1){
    let addr = lines[addrLineIdx].replace(/^ADDRESS\s*:?/i,"").trim();
    const nextLine = lines[addrLineIdx+1];
    if(nextLine && !/^(BRANCH|CUSTOMER|ADDRESS|PHONE|N\.P\.W\.P|DEL\.ADDR|MODEL|REMARKS|FAX|CURR|MERK|DOCUMENT|SERIAL|NOTE|NO\.)/i.test(nextLine)){
      addr += " " + nextLine;
    }
    addr = addr.split(LABELS_RE)[0];
    guessedAddress = addr.replace(/[,\s]+$/,"").trim();
  }

  let guessedDate = "";
  const docDateMatch = fullText.match(/DOCUMENT\s*DATE\s*:?\s*(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/i);
  const dateMatch = docDateMatch || fullText.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(dateMatch){
    let [_, dd, mm, yy] = dateMatch;
    if(yy.length===2) yy = "20"+yy;
    dd = dd.padStart(2,"0"); mm = mm.padStart(2,"0");
    const candidate = `${yy}-${mm}-${dd}`;
    if(!isNaN(new Date(candidate).getTime())) guessedDate = candidate;
  }

  let guessedModel = "";
  const modelMatch = fullText.match(/\bMODEL[ \t]*:?[ \t]*(?!SERIAL\b|REMARKS\b|MERK\b|NO\b)([A-Z0-9\-]{2,20})/i);
  if(modelMatch) guessedModel = modelMatch[1].trim().toUpperCase();

  let guessedSN = "";
  const snMatch = fullText.match(/SERIAL[ \t]*NO[ \t]*:?[ \t]*(?!REMARKS\b|MERK\b|NOTE\b)([A-Z0-9\-]{2,20})/i);
  if(snMatch) guessedSN = snMatch[1].trim().toUpperCase();

  const rowRegex = /^(\d{1,3})\s+(\d{1,3}\*?)\s+([A-Z0-9][A-Z0-9\-\.\/]{2,24})\s+(.+?)\s+(\d{1,6})\s+([\d.,]{2,})\s+IDR\s+([\d.,]{2,})\s*$/i;
  const guessedParts = [];
  for(let li=0; li<lines.length; li++){
    const line = lines[li];
    const m = line.match(rowRegex);
    if(m){
      let sup = extractSupersede(m[4]);
      let descClean = m[4].trim();
      if(sup) descClean = m[4].replace(SUPERSEDE_RE,"").replace(/[\s,;:\-\(\)]+$/,"").trim();
      // Format AIS asli: nomor part lama tercetak sendirian di baris tepat di bawah baris part, tanpa kata "SUPERSEDE".
      // Contoh: "1 24 32A6201020M ELEMENT KIT, FUEL 2 407,000 IDR 814,000" lalu baris berikutnya "32A6201020".
      if(!sup && li+1<lines.length){
        const nxt = lines[li+1].trim();
        if(/^[A-Z0-9][A-Z0-9\-\.\/]{3,24}$/i.test(nxt) && /\d/.test(nxt) && nxt.toUpperCase()!==m[3].toUpperCase() && !rowRegex.test(nxt)){
          sup = nxt.toUpperCase();
        }
      }
      // Format lain: kata SUPERSEDE/REPLACED/dst (maks 3 baris ke bawah, berhenti kalau ketemu baris part berikutnya)
      for(let j=li+1; j<Math.min(li+4, lines.length) && !sup; j++){
        if(rowRegex.test(lines[j])) break;
        sup = extractSupersede(lines[j]);
      }
      guessedParts.push({
        partNo: m[3],
        desc: descClean,
        qty: String(Number(m[5])||""),
        unitPrice: String(parseIDNumber(m[6])||""),
        supersede: sup
      });
    }
  }

  return { fullText, lines, guessedNominal, sectionTotals, guessedDisc, guessedPpn, guessedDocNo, guessedType, guessedCustomer, guessedAddress, guessedDate, guessedModel, guessedSN, guessedParts };
}
async function readPdfAsText(file){
  const buf = await file.arrayBuffer();
  const typedArray = new Uint8Array(buf);
  const pdf = await window.pdfjsLib.getDocument({data: typedArray}).promise;
  let fullText = "";
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const lineMap = {};
    content.items.forEach(item=>{
      const y = Math.round(item.transform[5]);
      if(!lineMap[y]) lineMap[y] = [];
      lineMap[y].push(item);
    });
    const lineYs = Object.keys(lineMap).map(Number).sort((a,b)=>b-a);
    const pageLines = lineYs.map(y=>{
      const its = lineMap[y].slice().sort((a,b)=>a.transform[4]-b.transform[4]);
      return its.map(it=>it.str).join(" ").replace(/\s+/g," ").trim();
    });
    fullText += pageLines.join("\n") + "\n";
  }
  return fullText;
}

function focusNextInPartRow(e){
  const rowEl = e.target.closest(".part-row");
  if(!rowEl) return;
  const inputs = Array.from(rowEl.querySelectorAll("input,select"));
  const idx = inputs.indexOf(e.target);
  if(idx>-1 && idx<inputs.length-1){
    inputs[idx+1].focus();
    return;
  }
  const section = e.target.closest(".parts-section");
  if(!section) return;
  const rows = Array.from(section.querySelectorAll(".part-row"));
  const rowIdx = rows.indexOf(rowEl);
  if(rowIdx>-1 && rowIdx<rows.length-1){
    const nextInputs = rows[rowIdx+1].querySelectorAll("input,select");
    if(nextInputs[0]) nextInputs[0].focus();
  } else {
    const addBtn = section.querySelector(".parts-header button");
    if(addBtn){
      addBtn.click();
      setTimeout(()=>{
        const newRows = section.querySelectorAll(".part-row");
        const last = newRows[newRows.length-1];
        const inp = last && last.querySelector("input,select");
        if(inp) inp.focus();
      }, 30);
    }
  }
}
function isWorkday(d, holidays){
  const day = d.getDay();
  if(day===0||day===6) return false;
  if(holidays.includes(localISO(d))) return false;
  return true;
}
function countWorkdaysBetween(start,end,holidays){
  let c=0; let d=new Date(start); d.setHours(0,0,0,0);
  const e=new Date(end); e.setHours(0,0,0,0);
  if(d>e) return 0;
  while(d<=e){ if(isWorkday(d,holidays)) c++; d.setDate(d.getDate()+1); }
  return c;
}

        return {key:k, info: info+" · "+(sz/1024).toFixed(1)+" KB"};
      });

  const backupFileInputRef = useRef(null);
  const [backupFileBusy,setBackupFileBusy] = useState(false);
  const [backupFileErr,setBackupFileErr] = useState("");
  const [backupFileDone,setBackupFileDone] = useState(false);
  const importFromBackupFile = (file)=>{
    setBackupFileBusy(true); setBackupFileErr(""); setBackupFileDone(false);
    const reader = new FileReader();
    reader.onerror = ()=>{
      setBackupFileErr("Gagal membaca file dari perangkat ini. Coba pilih ulang file-nya.");
      window.alert("GAGAL membaca file dari perangkat ini. Coba pilih ulang file-nya.");
      setBackupFileBusy(false);
      if(backupFileInputRef.current) backupFileInputRef.current.value = "";
    };
    reader.onload = async(ev)=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        const keyCount = Object.keys(parsed).length;
        if(keyCount===0){
          throw new Error("File JSON ini kosong, tidak ada data untuk di-import.");
        }
        const cloudData = await window.__jsonbinReadAll();
        let count = 0, mergedArrays = 0, addedNew = 0, keptExisting = 0;
        for(const k in parsed){
          if(!Object.prototype.hasOwnProperty.call(parsed, k)) continue;
          const backupRaw = parsed[k];
          const cloudRaw = cloudData[k];
          let backupArr = null, cloudArr = null;
          try{ backupArr = JSON.parse(backupRaw); }catch(e){ backupArr = null; }
          try{ cloudArr = cloudRaw!=null ? JSON.parse(cloudRaw) : null; }catch(e){ cloudArr = null; }

          if(Array.isArray(backupArr) && backupArr.every(x=>x && x.id!=null)){
            // Data berbentuk daftar (visit/sales/odo/customer) -> GABUNG aman berdasarkan id,
            // tidak pernah menghapus data yang sudah ada di cloud walau file backup-nya lebih lama/kosong.
            const map = {};
            if(Array.isArray(cloudArr)) cloudArr.forEach(item=>{ if(item && item.id!=null) map[item.id]=item; });
            backupArr.forEach(item=>{ if(item && item.id!=null && !map[item.id]) map[item.id]=item; });
            const merged = Object.values(map);
            cloudData[k] = JSON.stringify(merged);
            mergedArrays++;
          } else if(cloudRaw===undefined || cloudRaw===null || cloudRaw===""){
            // Key belum ada di cloud sama sekali -> aman diisi dari backup
            cloudData[k] = backupRaw;
            addedNew++;
          } else {
            // Key non-list (profile/target angka) sudah ada isinya di cloud -> jangan ditimpa otomatis,
            // biar tidak ada risiko mengganti setting yang sedang aktif dipakai.
            keptExisting++;
          }
          count++;
        }
        await window.__jsonbinWriteAll(cloudData);
        setBackupFileDone(true);
        window.alert("BERHASIL. " + count + " key diproses dari file backup ("+mergedArrays+" daftar digabung aman, "+addedNew+" data baru ditambah, "+keptExisting+" setting lama dipertahankan). Tidak ada data yang dihapus. Halaman akan dimuat ulang sekarang.");
        window.location.reload();
      }catch(e){
        const msg = "GAGAL import file backup. Detail: " + (e && e.message ? e.message : String(e));
        setBackupFileErr(msg);
        window.alert(msg);
      }finally{
        setBackupFileBusy(false);
        if(backupFileInputRef.current) backupFileInputRef.current.value = "";
      }
    };
    reader.readAsText(file);
  };

    if(!file) return;
    const reader = new FileReader();
    reader.onerror = ()=> setErr("Gagal membaca file tanda tangan.");
    reader.onload = ()=>{
      const im = new Image();
      im.onerror = ()=> setErr("File bukan gambar yang valid. Pakai JPG atau PNG.");
      im.onload = ()=>{
        // Kecilkan + putihkan latar jadi transparan, supaya ringan dan tidak menutupi watermark
        const maxW = 360, maxH = 150;
        const ratio = Math.min(maxW/im.width, maxH/im.height, 1);
        const w = Math.max(1, Math.round(im.width*ratio)), h = Math.max(1, Math.round(im.height*ratio));
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        const ctx = cv.getContext("2d");
        ctx.drawImage(im, 0, 0, w, h);
        try{
          const d = ctx.getImageData(0,0,w,h), px = d.data;
          for(let i=0;i<px.length;i+=4){
            const lum = 0.299*px[i] + 0.587*px[i+1] + 0.114*px[i+2];
            if(lum>=235){ px[i+3] = 0; }
            else if(lum>170){ px[i+3] = Math.round(255*(235-lum)/65); }
          }
          ctx.putImageData(d,0,0);
        }catch(e){}
        setSignerDraftImg(cv.toDataURL("image/png"));
      };
      im.src = reader.result;
    };
    reader.readAsDataURL(file);
  };

  useEffect(()=>{
    (async()=>{
      try{
        const legacy = await window.storage.get("odo_log");
        if(!legacy || !legacy.value) return;
        const oldRecords = JSON.parse(legacy.value);
        if(!Array.isArray(oldRecords) || oldRecords.length===0){
          try{ await window.storage.delete("odo_log"); }catch(e){}
          return;
        }
        const buckets = {};
        for(const r of oldRecords){
          if(!r.date) continue;
          const q = quarterKeyForDate(r.date);
          if(!buckets[q.key]) buckets[q.key] = [];
          buckets[q.key].push(r);
        }
        for(const key in buckets){
          let existing = [];
          try{
            const res = await window.storage.get("odo_records_"+key);
            existing = (res && res.value) ? JSON.parse(res.value) : [];
          }catch(e){ existing = []; }
          const existingIds = new Set(existing.map(x=>x.id));
          const merged = [...existing, ...buckets[key].filter(x=>!existingIds.has(x.id))];
          await window.storage.set("odo_records_"+key, JSON.stringify(merged));
        }
        await window.storage.delete("odo_log");
        setOdoByKey(prev=>({...prev, ...buckets}));
        setInfo("Data odometer lama berhasil dipindahkan otomatis supaya sesuai kuartal tanggalnya masing-masing.");
      }catch(e){
        // Tidak ada data lama untuk dimigrasi, aman diabaikan.
      }
    })();

        if(R.guessedDocNo) setQuoDocNo(R.guessedDocNo);

        if(R.guessedCustomer){
          const norm = s=> (s||"").replace(/^[A-Z]\d{4,6}-/,"").trim().toUpperCase().replace(/\s+/g," ");
          const gcNorm = norm(R.guessedCustomer);
          const matchedCust = customers.find(c=>{
            const cn = norm(c.name);
            return cn===gcNorm || cn.includes(gcNorm) || gcNorm.includes(cn);
          });
          if(matchedCust){

            if(matchedCust.phone) setQuoPhone(matchedCust.phone);
            if(matchedCust.pic) setQuoAttn("ATTN "+matchedCust.pic);
            if(matchedCust.address && !R.guessedAddress) setQuoAddress(matchedCust.address);
          }
        }

        let diffNote = "";
        if(R.guessedParts.length){
          // Isi tracker sebelumnya: baris dengan No. Part yang sama tetap membawa stock, remark, dan jenis supersede-nya
          const curRows = (quoFormat==="ais" ? quoAisRows : quoSpareParts) || [];
          const pnOf = r=> String(r.desc||"").split(",")[0].trim().toUpperCase();
          const oldByPn = {};
          curRows.forEach(r=>{ const k=pnOf(r); if(k) oldByPn[k]=r; });
          const carry = (p)=>{
            const old = oldByPn[String(p.partNo||"").trim().toUpperCase()];
            const out = {};
            if(!old) return out;
            if(old.stocks) out.stocks = old.stocks;
            if(old.stockLoc){ out.stockLoc = old.stockLoc; out.stockDetail = old.stockDetail||""; out.stockDays = old.stockDays||""; }
            if(old.remark) out.remark = old.remark;
            if(!p.supersede && old.supersede){ out.supersede = old.supersede; out.supKind = old.supKind||""; }
            else if(p.supersede && old.supersede && String(old.supersede).toUpperCase()===String(p.supersede).toUpperCase()){ out.supKind = old.supKind||""; }
            return out;
          };
          const hadRows = curRows.filter(r=>pnOf(r));
          if(hadRows.length){
            const newPn = new Set(R.guessedParts.map(p=>String(p.partNo||"").trim().toUpperCase()));
            let kept = 0; const added = [], changed = [];
            R.guessedParts.forEach(p=>{
              const old = oldByPn[String(p.partNo||"").trim().toUpperCase()];
              if(!old){ added.push(p.partNo); return; }
              kept++;
              const oldPrice = Number(String(old.unitPrice||"").replace(/\D/g,""))||0, newPrice = Number(p.unitPrice)||0;
              const oldQty = Number(old.qty)||0, newQty = Number(p.qty)||0;
              if(oldPrice!==newPrice) changed.push(p.partNo+" harga "+formatRupiah(oldPrice)+" -> "+formatRupiah(newPrice));

        setQuoPdfNote(foundParts.length

          : `Tidak berhasil menebak data dari "${file.name}". Silakan isi manual.`);

        setErr("Gagal membaca PDF. Detail: " + (e && e.message ? e.message : String(e)));

  const today = new Date();

  const remainingTarget = Math.max(target - visitCount, 0);

  const sortedEntries = [...entries].sort((a,b)=> (a.date<b.date?1:-1) || b.id-a.id );

  const odoRecordsAll = [...odoRecords].sort((a,b)=> (a.date<b.date?1:-1) || b.id-a.id );

  const filteredManageList = customers

  const sortedSales = [...salesEntries].sort((a,b)=> (a.date<b.date?1:-1) || b.id-a.id );
  const salesSearchClean = salesSearch.trim().toLowerCase();
  const sortedSalesFiltered = salesSearchClean

    : sortedSales;

  const salesTotalQ = salesEntries.reduce((sum,s)=>sum+(Number(s.nominal)||0),0);

  const monthlyBreakdown = useMemo(()=>{
    const startM = qStartDate.getMonth();
    const months = [0,1,2].map(offset=>{
      const mDate = new Date(qStartDate.getFullYear(), startM+offset, 1);
      const mKey = mDate.toISOString().slice(0,7);

  const annualReport = useMemo(()=>{
    const perQ = quarters.map(q=>{
      const key = year+"_"+q.id;

      const ss = salesByKey[key] || [];
      const visit = es.filter(e=>e.type==="visit").length;
      const call = es.filter(e=>e.type==="call").length;
      const newProspect = es.filter(e=>e.isNew).length;
      const existingCust = (visit+call) - newProspect;
      const salesVal = ss.reduce((sum,s)=>sum+(Number(s.nominal)||0),0);
      const tgt = targetByKey[key] ?? q.defaultTarget;
      return {id:q.id, label:q.id, visit, call, newProspect, existingCust, salesVal, target:tgt};
    });
    const totalVisit = perQ.reduce((s,q)=>s+q.visit,0);
    const totalCall = perQ.reduce((s,q)=>s+q.call,0);
    const totalNewProspect = perQ.reduce((s,q)=>s+q.newProspect,0);
    const totalExisting = perQ.reduce((s,q)=>s+q.existingCust,0);
    const totalSales = perQ.reduce((s,q)=>s+q.salesVal,0);
    const maxVisitCall = Math.max(1, ...perQ.map(q=>Math.max(q.visit,q.call)));
    const maxProspect = Math.max(1, ...perQ.map(q=>Math.max(q.newProspect,q.existingCust)));
    const maxSales = Math.max(1, ...perQ.map(q=>q.salesVal));
    return {perQ, totalVisit, totalCall, totalNewProspect, totalExisting, totalSales, maxVisitCall, maxProspect, maxSales};
  },[quarters, year, entriesByKey, salesByKey, targetByKey]);
  const salesProgressPct = salesTarget>0 ? Math.min(100, Math.round((annualReport.totalSales/salesTarget)*100)) : 0;

  const partCustomerReport = useMemo(()=>{
    const allSalesYear = quarters.flatMap(q => salesByKey[year+"_"+q.id] || []);
    const partMap = {}; // partNo -> {partNo, desc, qty, totalValue, customers:Set}
    const custMap = {}; // customer -> {customer, txCount, totalNominal}
    for(const s of allSalesYear){
      const custKey = UC(s.customer) || "(tanpa nama)";
      if(!custMap[custKey]) custMap[custKey] = {customer:custKey, txCount:0, totalNominal:0};
      custMap[custKey].txCount += 1;
      custMap[custKey].totalNominal += Number(s.nominal)||0;

      if(s.parts && s.parts.length){
        for(const p of s.parts){
          const pk = (p.partNo||"").trim();
          if(!pk) continue;
          if(!partMap[pk]) partMap[pk] = {partNo:pk, desc:p.desc||"", qty:0, totalValue:0, customers:new Set()};
          const qtyNum = Number(p.qty)||0;
          const unitPriceNum = Number(p.unitPrice)||0;
          partMap[pk].qty += qtyNum;
          partMap[pk].totalValue += qtyNum*unitPriceNum;
          if(!partMap[pk].desc && p.desc) partMap[pk].desc = p.desc;
          partMap[pk].customers.add(custKey);
        }
      }
    }
    const partList = Object.values(partMap)
      .map(p=>({partNo:p.partNo, desc:p.desc, qty:p.qty, totalValue:p.totalValue, customerCount:p.customers.size}))
      .sort((a,b)=> b.qty - a.qty);
    const custList = Object.values(custMap).sort((a,b)=> b.txCount - a.txCount || b.totalNominal - a.totalNominal);
    return {partList, custList};
  },[quarters, year, salesByKey]);

  // Daftar part yang pernah terjual (semua tahun yang sudah termuat), buat rekomendasi No.Part/Nama/Harga
  // saat bikin penawaran baru - diambil dari rincian part yang tersimpan di Data Penjualan.
  const knownParts = useMemo(()=>{
    const map = {};
    // Sumber 1: katalog global (part yang pernah diketik di Data Penjualan ATAU Buat Penawaran)
    Object.keys(partCatalog).forEach(pk=>{
      if(partCatalog[pk].deleted) return;
      map[pk] = {partNo:pk, desc:partCatalog[pk].desc||"", unitPrice:Number(partCatalog[pk].unitPrice)||0, lastDate:partCatalog[pk].lastDate||"", supersede:partCatalog[pk].supersede||"", supersedeKind:partCatalog[pk].supersedeKind||"", edited:!!partCatalog[pk].edited};
    });
    // Sumber 2: histori Data Penjualan yang sudah termuat (jaga-jaga ada part lama sebelum katalog global ada)
    Object.values(salesByKey).forEach(arr=>{
      (arr||[]).forEach(s=>{
        (s.parts||[]).forEach(p=>{
          const pk = (p.partNo||"").trim();
          if(!pk) return;
          if(partCatalog[pk] && partCatalog[pk].deleted) return;
          if(map[pk] && map[pk].edited) return;
          if(!map[pk] || (s.date && (!map[pk].lastDate || s.date>map[pk].lastDate))){
            map[pk] = {partNo:pk, desc:p.desc||(map[pk]?map[pk].desc:""), unitPrice:Number(p.unitPrice)||(map[pk]?map[pk].unitPrice:0), lastDate:s.date||"", supersede:(map[pk]?map[pk].supersede:"")||p.supersede||"", supersedeKind:(map[pk]&&map[pk].supersede) ? (map[pk].supersedeKind||"") : (p.supersedeKind||"")};
          }
        });
      });
    });
    return Object.values(map).sort((a,b)=> a.partNo.localeCompare(b.partNo));
  },[salesByKey, partCatalog]);
  const findKnownPart = (partNo)=> knownParts.find(p=>p.partNo.toUpperCase()===String(partNo||"").trim().toUpperCase());
  // Cocokkan dari teks gabungan "PN, Nama" atau cuma PN doang -> ambil bagian sebelum koma sebagai PN
  const findKnownPartFromCombined = (text)=>{
    const t = String(text||"").trim();
    if(!t) return null;
    const leadPart = t.split(",")[0].trim();
    return findKnownPart(leadPart);
  };
  const combinePartText = (kp)=> kp.partNo + (kp.desc ? ", "+kp.desc : "");

  // ===== Editor Katalog Part (edit No. Part / Nama / Harga / Supersede, atau hapus) =====
  const [pcSearch,setPcSearch] = useState("");
  const [pcEditKey,setPcEditKey] = useState(null);
  const [pcPn,setPcPn] = useState("");
  const [pcDesc,setPcDesc] = useState("");
  const [pcPrice,setPcPrice] = useState("");
  const [pcSup,setPcSup] = useState("");
  const [pcSupKind,setPcSupKind] = useState("");
  const savePartCatalogRaw = (next)=>{

  };
  const startEditCatalogPart = (p)=>{ setPcEditKey(p.partNo); setPcPn(p.partNo); setPcDesc(p.desc||""); setPcPrice(String(p.unitPrice||"")); setPcSup(p.supersede||""); setPcSupKind(p.supersedeKind||""); };
  const saveEditCatalogPart = ()=>{
    const oldKey = pcEditKey;
    const newKey = pcPn.trim();
    if(!newKey){ setErr("No. Part tidak boleh kosong."); return; }
    setErr("");
    const cat = {...partCatalog};

    if(newKey!==oldKey && cat[newKey] && !cat[newKey].deleted){

  };
  const deleteCatalogPart = (p)=>{

  const pcSearchClean = pcSearch.trim().toLowerCase();

    : knownParts;

      // Format AIS -> Manual: pindahkan isi Rincian Part AIS ke section SPARE PARTS
      const converted = quoAisRows.filter(r=>r.desc && r.desc.trim()).map(r=>({desc:r.desc, qty:r.qty, unitPrice:r.unitPrice, remark:"", supersede:r.supersede||"", supKind:r.supKind||"", stocks:r.stocks||[], stockLoc:r.stockLoc||"", stockDetail:r.stockDetail||"", stockDays:r.stockDays||""}));

  const addQuoAisRow = ()=> setQuoAisRows(prev=>[...prev, {agc:"24", desc:"", qty:"", unitPrice:""}]);

  const updateQuoAisRow = (idx, field, val)=> setQuoAisRows(prev=> prev.map((r,i)=>{

  const makeSectionRowHelpers = (setter, defaultRow)=>({

        if(kp){
          updated.desc = combinePartText(kp);
          updated.unitPrice = updated.unitPrice || String(kp.unitPrice||"");
        }
        const prevPn = (r.desc||"").split(",")[0].trim().toUpperCase();

        if(prevPn!==newPn){ updated.supersede = kp ? (kp.supersede||"") : ""; updated.supKind = kp ? (kp.supersedeKind||"") : ""; }
      }
      return updated;

  });
  const quoSparePartsH = makeSectionRowHelpers(setQuoSpareParts, {desc:"", qty:"", unitPrice:"", remark:""});
  const quoConsumableH = makeSectionRowHelpers(setQuoConsumable, {desc:"", qty:"", unitPrice:"", remark:""});
  const quoServiceH = makeSectionRowHelpers(setQuoService, {desc:"", qty:"", unitPrice:"", remark:""});

  const quoAisCalc = useMemo(()=>{
    const rows = quoAisRows.map(r=>{ const dp=Math.min(100,Math.max(0,Number(r.disc)||0)); const q=Number(r.qty)||0; const pr=Math.round((Number(r.unitPrice)||0)*(1-dp/100)); return {...r, qtyNum:q, priceNum:pr, ext:q*pr, dPct:dp, rowDisc:0}; });
    const totalValue = rows.reduce((s,r)=>s+r.ext,0);
    const rowDiscSum = 0;
    const anyRowDisc = rows.some(r=>r.dPct>0);
    const discPct = anyRowDisc ? 0 : (Number(quoDiscPct)||0);
    const discAmt = totalValue*discPct/100;
    const afterDisc = totalValue-discAmt;
    const ppnPct = quoPpnExclude ? 0 : (Number(quoPpnPct)||0);
    const ppn = afterDisc*(ppnPct/100);
    const total = afterDisc+ppn;
    return {rows, totalValue, discPct, rowDiscSum, discAmt, ppnPct, ppn, total};
  },[quoAisRows, quoDiscPct, quoPpnPct, quoPpnExclude]);

  const calcSection = (rows, applyDisc, discPct, ppnPct)=>{
    const r2 = rows.map(r=>{ const dp=Math.min(100,Math.max(0,Number(r.disc)||0)); const q=Number(r.qty)||0; const pr=Math.round((Number(r.unitPrice)||0)*(1-dp/100)); return {...r, qtyNum:q, priceNum:pr, ext:q*pr, dPct:dp, rowDisc:0}; });
    const totalValue = r2.reduce((s,r)=>s+r.ext,0);
    const anyRowDisc = r2.some(r=>r.dPct>0);
    const discAmt = (applyDisc && !anyRowDisc) ? totalValue*(Number(discPct)||0)/100 : 0;
    const afterDisc = totalValue-discAmt;
    const ppn = afterDisc*((Number(ppnPct)||0)/100);
    const total = afterDisc+ppn;
    return {rows:r2, totalValue, discAmt, ppn, total};
  };
  const quoManualCalc = useMemo(()=>({
    spareParts: calcSection(quoSpareParts, true, quoManualDiscPct, quoPpnExclude?0:quoPpnPct),

  }),[quoSpareParts, quoConsumable, quoService, quoManualDiscPct, quoPpnPct, quoPpnExclude]);

  // Scope kerja otomatis dari Spare Parts + Consumable
  const quoScopeAutoText = useMemo(()=>{
    const ABBR = {TIL:"Tilt",TILT:"Tilt",STE:"Steering",STEER:"Steering",STEERI:"Steering",STEERIN:"Steering",STEERING:"Steering",LIF:"Lift",LIFT:"Lift"};
    const tc = t=>t.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
    const nameOf = d=>{ const p=String(d||"").split(","); const n=(p.length>1?p.slice(1):p).map(x=>x.trim()).filter(Boolean); return n; };
    const clean = n=>n.join(" ").split(/\s+/).filter(w=>!/\d/.test(w)).map(w=>ABBR[w.toUpperCase()]||w).join(" ").trim();
    const spare = quoSpareParts.filter(r=>r.desc&&r.desc.trim()).map(r=>{
      const n=nameOf(r.desc); if(!n.length) return "";
      if(/SEAL KIT/i.test(n[0])){ const k=ABBR[(n[1]||"").toUpperCase()]; if(k) return "Exchange Seal Kit "+k+" Cylinder"; }
      const c=clean(n); return c ? "Exchange "+tc(c) : "";

    const cons = quoConsumable.filter(r=>r.desc&&r.desc.trim()).map(r=>{
      const n=nameOf(r.desc); const up=n.join(" ").toUpperCase(); if(!n.length) return "";

      if(/OIL|OLI/.test(up) && /ENGINE|MESIN/.test(up)) return "Exchange Engine Oil";

  const newQuotation = ()=>{
    setQuoEditingId(null);
    setQuoDocNo(""); setQuoCustomerId(""); setQuoCustomerName(""); setQuoAddress(""); setQuoPhone("");
    setQuoAttn(""); setQuoMerk(""); setQuoModel(""); setQuoSN(""); setQuoCustPoNo("BY VISIT"); setQuoPrNo("");
    setQuoDiscPct("0"); setQuoManualDiscPct("0"); setQuoPpnPct(ppnDefault); setQuoPpnExclude(false);
    setQuoScopeAuto(true); setQuoScopeText(""); setQuoScopeTitle("SCOPE PEKERJAAN / SERVICE"); setQuoTermsAuto(true); setQuoTermsText("");
    setQuoAisRows([{agc:"24", desc:"", qty:"", unitPrice:""}]);
    setQuoSpareParts([{desc:"", qty:"", unitPrice:"", remark:""}]);
    setQuoConsumable([{desc:"", qty:"", unitPrice:"", remark:""}]);
    setQuoService([{desc:"", qty:"", unitPrice:"", remark:""}]);
    setValidationResult(null);
  };
  const deleteQuotation = (q)=>{
    if(!window.confirm("Hapus penawaran "+q.docNo+" dari riwayat? Tindakan ini tidak bisa dibatalkan.")) return;
    persistQuotationsForQ(qKey, (quotationsByKey[qKey]||[]).filter(x=>x.id!==q.id));
    if(quoEditingId===q.id) newQuotation();
  };
  const todayStr = ()=> localISO();
  const daysSince = (dateStr)=>{
    if(!dateStr) return 0;
    const a = new Date(dateStr+"T00:00:00"); const b = new Date(); b.setHours(0,0,0,0);
    return Math.floor((b-a)/86400000);
  };
  const holidaysForRange = (a,b)=> [...new Set([...getHolidaysForYear(a.getFullYear()), ...getHolidaysForYear(b.getFullYear())])];
  // Jumlah hari kerja yang sudah lewat sejak tanggal tsb (tanggal itu sendiri tidak dihitung)
  const workdaysSince = (dateStr)=>{
    if(!dateStr) return 0;
    const start = new Date(dateStr+"T00:00:00"); start.setDate(start.getDate()+1);
    const end = new Date();
    return countWorkdaysBetween(start, end, holidaysForRange(start, end));
  };
  const quoRawStatus = (q)=> q.status || (q.dealtSaleId ? "deal" : "open");
  // Lost otomatis: tidak disimpan, dihitung dari tanggal penawaran (atau tanggal "Buka lagi" terakhir)
  const quoAutoLost = (q)=>{
    if(quoRawStatus(q)!=="open") return false;
    const base = q.reopenedAt || q.docDate;
    if(!base) return false;
    const lim = new Date(base+"T00:00:00"); lim.setMonth(lim.getMonth()+AUTO_LOST_MONTHS);
    const t = new Date(); t.setHours(0,0,0,0);
    return lim<=t;
  };
  const quoStatus = (q)=> quoAutoLost(q) ? "lost" : quoRawStatus(q);
  const quoFuBase = (q)=> q.followUpAt || q.docDate;
  const quoNeedsFu = (q)=> quoStatus(q)==="open" && workdaysSince(quoFuBase(q))>=FOLLOWUP_WORKDAYS;

  // Deal: langsung tercatat di Data Penjualan (tanpa konfirmasi). Salah klik bisa dibatalkan lewat "Batal Deal".
  const dealQuotationToSale = (q)=>{
    if(q.dealtSaleId){ setInfo("Penawaran "+q.docNo+" sudah masuk Data Penjualan."); return; }
    const splitPartText = (text)=>{
      const [pn, ...rest] = (text||"").split(",");
      return {partNo:(pn||"").trim(), desc:rest.join(",").trim()};
    };
    let totalAll, partsForSale;
    const qPpnPct = q.ppnExclude ? "0" : (q.ppnPct!=null ? q.ppnPct : "11");
    if(q.format==="ais"){
      const calc = calcSection(q.aisRows||[], true, q.discPct, qPpnPct);
      totalAll = Math.round(calc.total);
      partsForSale = calc.rows.map(r=>({...splitPartText(r.desc), qty:r.qtyNum, unitPrice:r.priceNum, supersede:r.supersede||"", supersedeKind:r.supKind||""})).filter(p=>p.partNo && p.qty>0);
    } else {
      const sp = calcSection(q.spareParts||[], true, q.manualDiscPct, qPpnPct);
      const cs = calcSection(q.consumable||[], false, 0, qPpnPct);
      const sv = calcSection(q.service||[], false, 0, qPpnPct);
      totalAll = Math.round(sp.total + cs.total + sv.total);
      partsForSale = sp.rows.map(r=>({...splitPartText(r.desc), qty:r.qtyNum, unitPrice:r.priceNum, supersede:r.supersede||"", supersedeKind:r.supKind||""})).filter(p=>p.partNo && p.qty>0);
    }
    const saleDate = todayStr();
    const saleObj = {
      id: Date.now(), date: saleDate, customer: UC(q.customerName), docNo: q.docNo,
      docType: "Quotation", nominal: totalAll, note: "Dari Buat Penawaran (deal) - penawaran tgl "+q.docDate, parts: partsForSale, quoId: q.id
    };
    persistSaleToItsQuarter(saleObj, saleDate);
    if(partsForSale.length) mergePartsIntoCatalog(partsForSale, saleDate);
    persistQuotationToItsQuarter({...q, dealtSaleId: saleObj.id, dealtDate: saleDate, status:"deal", statusAt: saleDate, lostReason:""}, q.docDate);
    const sq = quarterKeyForDate(saleDate);
    setInfo("DEAL: penawaran "+q.docNo+" masuk Data Penjualan senilai "+formatRupiah(totalAll)+" pada tanggal deal "+saleDate+" ("+sq.qId+" "+sq.year+").");
  };
  const undoDeal = async(q)=>{
    if(!window.confirm("Batalkan Deal untuk "+q.docNo+"? Transaksinya akan dihapus dari Data Penjualan dan penawaran kembali berstatus Open.")) return;
    const sk = quarterKeyForDate(q.dealtDate || q.docDate);
    let base;
    if(sk.year===year){ base = salesByKey[sk.key] || []; }
    else {
      try{ const r = await window.storage.get("sales_entries_"+sk.key); base = (r && r.value) ? JSON.parse(r.value) : []; }
      catch(e){ base = []; }
    }
    persistSalesForQ(sk.key, base.filter(x=>x.id!==q.dealtSaleId));
    persistQuotationToItsQuarter({...q, dealtSaleId:null, dealtDate:null, status:"open", statusAt: todayStr()}, q.docDate);
    setInfo("Deal "+q.docNo+" dibatalkan dan dihapus dari Data Penjualan.");
  };
  const markQuotationLost = (q)=>{
    const reason = window.prompt("Kenapa lost? (opsional, mis. harga kemahalan / pakai kompetitor / batal beli)", "");
    if(reason===null) return;
    persistQuotationToItsQuarter({...q, status:"lost", statusAt: todayStr(), lostReason: reason.trim()}, q.docDate);
    setInfo("Penawaran "+q.docNo+" ditandai LOST.");
  };
  const reopenQuotation = (q)=>{
    persistQuotationToItsQuarter({...q, status:"open", statusAt: todayStr(), lostReason:"", followUpAt: todayStr(), reopenedAt: todayStr()}, q.docDate);
    setInfo("Penawaran "+q.docNo+" dibuka lagi (Open). Pengingat follow up "+FOLLOWUP_WORKDAYS+" hari kerja dari hari ini, dan hitungan Lost otomatis "+AUTO_LOST_MONTHS+" bulan mulai dari hari ini.");
  };
  const markFollowedUp = (q)=>{
    persistQuotationToItsQuarter({...q, followUpAt: todayStr(), followUpCount:(q.followUpCount||0)+1}, q.docDate);
    setInfo("Follow up "+q.docNo+" dicatat. Pengingat berikutnya "+FOLLOWUP_WORKDAYS+" hari kerja lagi.");
  };
  // Data penjualan yang diturunkan dari sebuah penawaran (sama dengan yang dipakai saat Deal)
  const quoToSaleData = (q)=>{
    const splitPartText = (text)=>{
      const [pn, ...rest] = (text||"").split(",");
      return {partNo:(pn||"").trim(), desc:rest.join(",").trim()};
    };
    const qPpnPct = q.ppnExclude ? "0" : (q.ppnPct!=null ? q.ppnPct : "11");
    let totalAll, partsForSale;
    if(q.format==="ais"){
      const calc = calcSection(q.aisRows||[], true, q.discPct, qPpnPct);
      totalAll = Math.round(calc.total);
      partsForSale = calc.rows.map(r=>({...splitPartText(r.desc), qty:r.qtyNum, unitPrice:r.priceNum, supersede:r.supersede||"", supersedeKind:r.supKind||""})).filter(p=>p.partNo && p.qty>0);
    } else {
      const sp = calcSection(q.spareParts||[], true, q.manualDiscPct, qPpnPct);
      const cs = calcSection(q.consumable||[], false, 0, qPpnPct);
      const sv = calcSection(q.service||[], false, 0, qPpnPct);
      totalAll = Math.round(sp.total + cs.total + sv.total);
      partsForSale = sp.rows.map(r=>({...splitPartText(r.desc), qty:r.qtyNum, unitPrice:r.priceNum, supersede:r.supersede||"", supersedeKind:r.supKind||""})).filter(p=>p.partNo && p.qty>0);
    }
    return {totalAll, partsForSale};
  };
  // Samakan Data Penjualan yang terhubung dengan penawaran ini. full=false: hanya No. Dokumen & customer
  // (nilai yang mungkin sudah kamu sesuaikan manual tidak disentuh). full=true: nilai & part ikut diperbarui.
  const syncSaleFromQuotation = async(q, full)=>{
    if(!q.dealtSaleId) return false;
    const sk = quarterKeyForDate(q.dealtDate || q.docDate);
    let base;
    if(sk.year===year){ base = salesByKey[sk.key] || []; }
    else {
      try{ const r = await window.storage.get("sales_entries_"+sk.key); base = (r && r.value) ? JSON.parse(r.value) : []; }
      catch(e){ base = []; }
    }
    if(!base.some(x=>x.id===q.dealtSaleId)) return false;
    const d = full ? quoToSaleData(q) : null;
    persistSalesForQ(sk.key, base.map(x=> x.id!==q.dealtSaleId ? x : {
      ...x, docNo:q.docNo, customer:UC(q.customerName),
      ...(d ? {nominal:d.totalAll, parts:d.partsForSale} : {})
    }));
    if(d && d.partsForSale.length) mergePartsIntoCatalog(d.partsForSale, q.dealtDate || q.docDate);
    return true;
  };
  // Setelah PO: ganti nomor tracker (mis. PQ00035) dengan No. PQ asli dari AIS. Nomor tracker lama dicatat
  // supaya tidak dipakai lagi, dan Data Penjualan terkait ikut disamakan No. Dokumennya.
  const syncToAisPq = async(q)=>{
    const input = window.prompt("Masukkan No. PQ asli dari sistem AIS untuk penawaran "+(q.docNo||"")+"\n(mis. 2602PQ06729):","");
    if(input===null) return;
    const newNo = input.trim().toUpperCase();
    if(!newNo) return;
    if(newNo===(q.docNo||"").trim().toUpperCase()){ setInfo("Nomornya sama, tidak ada yang diubah."); return; }
    const clash = findDocNoClash(newNo, q.id);
    if(clash && !window.confirm("Nomor "+newNo+" sudah dipakai di penawaran customer \""+(clash.customerName||"-")+"\" tanggal "+(clash.docDate||"-")+".\n\nTetap pakai nomor ini?")) return;
    const oldNo = (q.docNo||"").trim();
    const updated = {...q, docNo:newNo, trackerNo: q.trackerNo || (/^PQ\d{5}$/i.test(oldNo) ? oldNo : undefined)};
    await persistQuotationToItsQuarter(updated, q.docDate);
    const synced = await syncSaleFromQuotation(updated, false);
    if(quoEditingId===q.id) setQuoDocNo(newNo);
    setInfo("No. "+oldNo+" diganti menjadi "+newNo+(updated.trackerNo?" (No. tracker "+updated.trackerNo+" tetap dicatat)":"")+(synced?", Data Penjualan terkait ikut disamakan.":"."));
  };

  // Draft follow up ke customer (WA santai & email resmi) untuk penawaran yang belum ada kabar
  const picFromAttn = (attn)=>{
    const t = String(attn||"").replace(/^ATTN\.?\s*/i,"").trim();
    if(!t) return "Bapak/Ibu";
    const title = (w)=> w.toLowerCase().replace(/(^|\s)\S/g, c=>c.toUpperCase());
    let m = t.match(/^(BP\.?|BAPAK|PAK)\s+(.+)$/i); if(m) return "Pak "+title(m[2]);
    m = t.match(/^(IBU|IBK|BU)\.?\s+(.+)$/i); if(m) return "Bu "+title(m[2]);
    return title(t);
  };
  const buildFuDraft = (q)=>{
    const pic = picFromAttn(q.attn);
    const picFormal = pic.replace(/^Pak /,"Bapak ").replace(/^Bu /,"Ibu ");
    const cust = UC(String(q.customerName||"").replace(/^[A-Z]\d{3,6}\s*-\s*/i,""));
    const rows = (q.format==="ais" ? (q.aisRows||[]) : (q.spareParts||[])).filter(r=>(r.desc||"").trim());
    const pns = rows.map(r=>String(r.desc).split(",")[0].trim()).filter(Boolean);
    const itemLine = pns.length ? pns.length+" item ("+pns.slice(0,3).join(", ")+(pns.length>3?", dst":"")+")" : "";
    const dateStr = q.docDate ? new Date(q.docDate+"T00:00:00").toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'}) : "-";
    const total = formatRupiah(Number(q.totalAll)||0);
    const expired = daysSince(q.docDate) >= 14;
    const sg = signerName || "M. Rizal Fauzi";
    const hh = new Date().getHours();
    const sapa = hh<11 ? "pagi" : (hh<15 ? "siang" : (hh<18 ? "sore" : "malam"));
    const wa = "Selamat "+sapa+", "+pic+"\n"
      + cust+"\n\n"
      + "Saya "+sg+" dari PT. Berca Mandiri Perkasa. Mau menindaklanjuti penawaran yang sudah kami kirim:\n"
      + "- No. Penawaran: "+(q.docNo||"-")+"\n"
      + "- Tanggal: "+dateStr+"\n"
      + (itemLine ? "- Item: "+itemLine+"\n" : "")
      + "- Total: "+total+"\n\n"
      + "Bagaimana kabarnya? Apakah ada yang perlu kami sesuaikan (harga, stock, atau estimasi pengiriman)?\n"
      + (expired ? "Kalau masa berlaku penawaran sudah lewat, kami bisa update harga dan stock terbaru.\n" : "")
      + "Kalau sudah ada keputusan, kabari ya, kami siap bantu proses PO-nya.\n\n"
      + "Terima kasih.\n"
      + "Salam,\n"+sg+" - PT. Berca Mandiri Perkasa";
    const emailSubject = "Follow Up Penawaran Harga No. "+(q.docNo||"-")+" - "+cust;
    const emailBody = "Kepada Yth.\n"+picFormal+"\n"+cust+"\n\n"
      + "Dengan hormat,\n\n"
      + "Sehubungan dengan penawaran harga yang telah kami sampaikan pada tanggal "+dateStr+" (No. Dokumen: "+(q.docNo||"-")+", total "+total+"), kami ingin menanyakan perkembangannya. Apakah ada hal yang perlu kami sesuaikan, seperti harga, ketersediaan stock, atau estimasi pengiriman?\n\n"
      + (expired ? "Mengingat masa berlaku penawaran 2 (dua) minggu telah terlewati, kami dapat memperbarui harga dan ketersediaan stock apabila diperlukan.\n\n" : "")
      + "Apabila sudah ada keputusan, kami siap membantu proses selanjutnya. Terima kasih atas perhatian dan kerja samanya.\n\n"
      + "Hormat kami,\n"+sg+"\nPT. Berca Mandiri Perkasa - Branch Cilegon";
    return {wa, emailSubject, emailBody};
  };

  // Rapikan massal: penawaran Open sebelum tanggal X. Kalau No. Dokumennya sudah ada di Data Penjualan -> Deal,
  // sisanya -> Arsip (tidak dihitung di win rate / hit rate). Data tiap kuartal disimpan sekali saja.
  const computeBulk = (cutoff)=>{
    const saleByDoc = {};
    Object.values(salesByKey).flat().forEach(x=>{ const k=String(x.docNo||"").trim().toUpperCase(); if(k) saleByDoc[k]=x; });
    const updates = {}; let nDeal=0, nArsip=0;
    if(!cutoff) return {updates, nDeal, nArsip};
    Object.keys(quotationsByKey).forEach(key=>{
      let changed = false;
      const next = (quotationsByKey[key]||[]).map(q=>{
        if(quoStatus(q)!=="open" || !q.docDate || q.docDate>=cutoff) return q;
        changed = true;
        const sale = saleByDoc[String(q.docNo||"").trim().toUpperCase()];
        if(sale){ nDeal++; return {...q, status:"deal", statusAt: todayStr(), dealtSaleId: sale.id, dealtDate: sale.date||q.docDate}; }
        nArsip++; return {...q, status:"arsip", statusAt: todayStr()};
      });
      if(changed) updates[key] = next;
    });
    return {updates, nDeal, nArsip};
  };
  const applyBulk = ()=>{
    const b = computeBulk(bulkCutoff);
    if(b.nDeal+b.nArsip===0){ setInfo("Tidak ada penawaran Open sebelum "+bulkCutoff+"."); return; }
    if(!window.confirm("Rapikan "+(b.nDeal+b.nArsip)+" penawaran Open sebelum "+bulkCutoff+"?\n\n"+b.nDeal+" cocok dengan Data Penjualan -> Deal\n"+b.nArsip+" sisanya -> Arsip (tidak dihitung di win rate)\n\nBisa dibuka lagi satu per satu lewat tombol \"Buka lagi\".")) return;
    Object.keys(b.updates).forEach(k=>persistQuotationsForQ(k, b.updates[k]));
    setInfo("Dirapikan: "+b.nDeal+" jadi Deal (sesuai Data Penjualan), "+b.nArsip+" jadi Arsip.");
  };
  const renderQuoStatusButtons = (q)=>{
    const st = quoStatus(q);
    const btn = (label, onClick, bg, fg)=>(
      <span className="icon-btn" style={{fontSize:11,padding:"3px 8px",background:bg||"var(--paper-raise)",color:fg||"var(--ink)",borderColor:bg&&bg!=="var(--paper-raise)"?bg:"var(--ink)"}} onClick={onClick}>{label}</span>
    );
    return (
      <span style={{display:"inline-flex",gap:6,flexWrap:"wrap"}}>
        {st==="open" && btn("Draft FU", ()=>{ setFuDraftId(q.id); setTimeout(()=>{ const el=document.getElementById("fuDraftPanel"); if(el && el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"start"}); },60); })}
        {st==="open" && btn("Deal", ()=>dealQuotationToSale(q), "var(--green)", "#fff")}
        {st==="open" && btn("Lost", ()=>markQuotationLost(q), "var(--red)", "#fff")}
        {st==="open" && btn("Sudah FU", ()=>markFollowedUp(q))}
        {st==="deal" && btn("Batal Deal", ()=>undoDeal(q))}
        {(st==="lost" || st==="arsip") && btn("Buka lagi", ()=>reopenQuotation(q))}
      </span>
    );
  };
  const quotationsThisQ = quotationsByKey[qKey] || [];
  const quoSearchClean = quoSearch.trim().toLowerCase();
  const quoMatchesStatus = (q)=>{
    if(quoStatusFilter==="all") return true;
    if(quoStatusFilter==="fu") return quoNeedsFu(q);
    return quoStatus(q)===quoStatusFilter;
  };
  const quotationsFiltered = (quoSearchClean ? Object.values(quotationsByKey).flat() : quotationsThisQ).filter(q=>
    quoMatchesStatus(q) &&
    (!quoSearchClean || (q.docNo||"").toLowerCase().includes(quoSearchClean) || (q.trackerNo||"").toLowerCase().includes(quoSearchClean) || (q.customerName||"").toLowerCase().includes(quoSearchClean)));
  const quoCounts = {
    all: quotationsThisQ.length,
    open: quotationsThisQ.filter(q=>quoStatus(q)==="open").length,
    fu: quotationsThisQ.filter(quoNeedsFu).length,
    deal: quotationsThisQ.filter(q=>quoStatus(q)==="deal").length,
    lost: quotationsThisQ.filter(q=>quoStatus(q)==="lost").length,
    arsip: quotationsThisQ.filter(q=>quoStatus(q)==="arsip").length
  };
  const sumTotal = (arr)=> arr.reduce((a,q)=>a+(Number(q.totalAll)||0),0);
  const quoValues = {
    deal: sumTotal(quotationsThisQ.filter(q=>quoStatus(q)==="deal")),
    lost: sumTotal(quotationsThisQ.filter(q=>quoStatus(q)==="lost")),
    open: sumTotal(quotationsThisQ.filter(q=>quoStatus(q)==="open"))
  };
  const quoReport = (()=>{
    const list = quarters.flatMap(qq=> quotationsByKey[year+"_"+qq.id] || []);
    const by = st=> list.filter(x=>quoStatus(x)===st);
    const deal = by("deal"), lost = by("lost"), open = by("open"), arsip = by("arsip");
    const closed = deal.length + lost.length;
    const active = list.length - arsip.length;
    return {
      list, deal, lost, open, arsip,
      dealVal: sumTotal(deal), lostVal: sumTotal(lost), openVal: sumTotal(open),
      winRate: closed>0 ? Math.round(deal.length/closed*100) : null,
      hitRate: active>0 ? Math.round(deal.length/active*100) : null
    };
  })();
  const fuList = Object.values(quotationsByKey).flat().filter(quoNeedsFu)
    .sort((a,b)=> workdaysSince(quoFuBase(b)) - workdaysSince(quoFuBase(a)));
  const bulkInfo = computeBulk(bulkCutoff);
  const fuDraftQ = fuDraftId ? findQuotationById(fuDraftId) : null;
  const fuDraft = fuDraftQ ? buildFuDraft(fuDraftQ) : null;
  const quotationsSorted = [...quotationsFiltered].sort((a,b)=> (b.savedAt||"").localeCompare(a.savedAt||""));

  // ===== Cek Validasi Kalkulasi (logika lokal, instan, tanpa API luar) =====
  const [validationResult,setValidationResult] = useState(null);
  const runValidation = ()=>{
    const issues = [];
    if(!quoCustomerName.trim()) issues.push("Nama customer belum diisi.");
    if(!quoDocNo.trim()) issues.push("No. Dokumen belum diisi.");
    if(!quoDocDate) issues.push("Tanggal dokumen belum diisi.");

    if(quoFormat==="ais"){
      const filled = quoAisCalc.rows.filter(r=>r.qtyNum>0);
      if(filled.length===0) issues.push("Belum ada baris part dengan Qty lebih dari 0.");
      quoAisCalc.rows.forEach((r,i)=>{
        if(r.qtyNum>0 && !r.priceNum) issues.push(`Baris ${i+1} (${r.desc||"tanpa Part"}): Qty diisi tapi Unit Price masih kosong/0.`);
        if(r.qtyNum>0 && !r.desc.trim()) issues.push(`Baris ${i+1}: Deskripsi masih kosong.`);
      });
      const recompTotal = (quoAisCalc.totalValue-quoAisCalc.discAmt)*(1+((quoPpnExclude?0:(Number(quoPpnPct)||0))/100));
      if(Math.abs(recompTotal-quoAisCalc.total)>2){
        issues.push("Ditemukan selisih hasil hitung ulang Total (kemungkinan pembulatan) — mohon dicek manual sekali lagi.");
      }
    } else {
      const sections = [
        {name:"SPARE PARTS", calc:quoManualCalc.spareParts},
        {name:"CONSUMABLE/COMMODITY", calc:quoManualCalc.consumable},
        {name:"SERVICE", calc:quoManualCalc.service}
      ];
      const anyFilled = sections.some(s=>s.calc.rows.some(r=>r.qtyNum>0));
      if(!anyFilled) issues.push("Belum ada baris item dengan Qty lebih dari 0 di ketiga section.");
      sections.forEach(s=>{
        s.calc.rows.forEach((r,i)=>{
          if(r.qtyNum>0 && !r.priceNum) issues.push(`${s.name} baris ${i+1}: Qty diisi tapi Unit Price masih kosong/0.`);
          if(r.qtyNum>0 && !r.desc.trim()) issues.push(`${s.name} baris ${i+1}: Deskripsi/Nama Part masih kosong.`);
        });
      });
    }
    setValidationResult({ ok: issues.length===0, issues, checkedAt: new Date().toLocaleTimeString('id-ID') });
  };

  // ===== Draft Pesan WA & Email (template lokal, tanpa API luar) =====
  const greetingByHour = ()=>{
    const h = new Date().getHours();
    if(h<11) return "pagi";
    if(h<15) return "siang";
    if(h<18) return "sore";
    return "malam";

                      <tr className="quo-manual-total-row"><td className="quo-manual-total-lbl quo-manual-grandtotal" style={{textAlign:"center"}}>GRAND TOTAL</td><td className="quo-manual-total-val quo-manual-grandtotal">{Math.round(grand).toLocaleString("id-ID")}</td></tr>
                    </tbody>
