              <div className="quo-manual-signblock">
                {quoScopeOn && quoTermsLines.length>0 && <div style={{fontSize:11,margin:"6px 0 8px 14px",lineHeight:1.5}}>{quoTermsLines.map((l,i)=><div key={i}>{l}</div>)}</div>}
                {quoSettings.validity && !(quoScopeOn && quoTermsLines.length>0) && <div className="quo-manual-note-italic">{quoSettings.validity}</div>}
                {quoAnyStock && <div className="quo-manual-note-italic">{STOCK_DISCLAIMER}</div>}
                <div className="quo-manual-sign-row">
                  <div>PT. BERCA MANDIRI PERKASA</div>
                  <div>DI SETUJUI CUSTOMER</div>
                </div>
                <div className="quo-manual-sign-space">{signerImg && <img src={signerImg} alt="" className="quo-sign-img" />}</div>
                <div className="quo-manual-sign-name-row">
                  <div>{signerName}</div>
                  <div></div>
                </div>
              </div>
            </div>
            </div>
          )}
        </React.Fragment>
      )}

      {mainView==="settings" && (
        <React.Fragment>
          <h2 className="section" style={{marginTop:0}}>Pengaturan Tracker VCS {helpBtn("umum")}</h2>
          <div className="extract-note" style={{marginTop:0}}>Semua pengaturan di sini juga bisa diubah langsung dari menu terkait (mis. Buat Penawaran). Klik tanda tanya (?) untuk petunjuk pengisian.</div>
          {renderQuoSettings()}
          {renderAutoBackupPanel()}
          {renderSignerCard()}
          {renderBgSettings()}
          <div className="signer-card no-print">
            <h2 className="section" style={{marginTop:0}}>Impor Data Lama</h2>
            <div className="extract-note" style={{marginTop:0}}>Kalau dulu pernah menutup notifikasi impor data lama, atau proses impornya gagal, klik ini untuk cek ulang.</div>
            <button type="button" className="icon-btn" onClick={recheckLegacyImport}>Cek Data Lokal Lama</button>
          </div>
        </React.Fragment>
      )}

      {mainView==="faq" && (
        <React.Fragment>
          <h2 className="section" style={{marginTop:0}}>Panduan Pemakaian Tracker VCS</h2>

          <div className="faq-item">
            <h3>Bagaimana cara kerja tracker ini?</h3>
            <p>Semua data (Visit, Call, Penjualan, Odometer) langsung tersimpan otomatis ke Cloud setiap kali disimpan — tidak perlu tombol "save" terpisah, dan tidak perlu backup manual untuk pemakaian sehari-hari. Bisa dibuka dari HP, PC, atau perangkat mana saja, asal tersambung ke Cloud yang sama.</p>
          </div>

          <div className="faq-item">
            <h3>Kenapa harus isi API Key dan Bin ID tiap buka di perangkat baru?</h3>
            <p>Itu "kunci penghubung" ke database Cloud. Sekali diisi di satu perangkat, browser itu akan mengingatnya sendiri untuk pemakaian berikutnya. Cuma perlu diisi ulang kalau ganti perangkat baru, ganti browser, atau data browser dibersihkan.</p>
          </div>

          <div className="faq-item">
            <h3>Apa bedanya "Backup Data Cloud" dan data yang otomatis tersimpan?</h3>
            <p>Data yang diinput sehari-hari sudah otomatis aman di Cloud, real-time, tanpa perlu backup. Tombol <strong>"Backup Data Cloud (JSON)"</strong> itu cadangan tambahan — semacam "foto" kondisi data di tanggal itu, disimpan sebagai file di perangkat. Berguna kalau suatu saat ada masalah teknis dan perlu memulihkan data. Disarankan diklik sesekali (misal akhir bulan) dan disimpan filenya di Google Drive.</p>
          </div>

          <div className="faq-item">
            <h3>Bagaimana cara memulihkan data dari file backup?</h3>
            <p>Klik tombol <strong>"Restore dari Backup"</strong> di bagian atas, pilih file .json hasil backup sebelumnya. Data di file itu akan digabungkan ke Cloud yang sedang aktif (tidak menghapus data yang sudah ada, hanya menambahkan/menimpa key yang sama).</p>
          </div>

          <div className="faq-item">
            <h3>Kenapa data Visit/Call/Odometer/Penjualan kadang "nyangkut" di kuartal yang salah?</h3>
            <p>Tidak akan terjadi — sistem otomatis membaca tanggal yang diisi dan menyimpan ke kuartal yang sesuai (Q1/Q2/Q3/Q4), berapa pun tab yang sedang dibuka saat itu. Ini berlaku untuk Visit/Call, Odometer, maupun Data Penjualan. Kalau ternyata beda dari kuartal yang sedang dibuka, akan muncul info singkat memberi tahu ke kuartal mana data itu tersimpan. Begitu juga kalau tanggal sebuah catatan diedit ke bulan lain — catatannya otomatis ikut pindah ke kuartal yang sesuai.</p>
          </div>

          <div className="faq-item">
            <h3>Bagaimana cara isi Rincian Part di Data Penjualan?</h3>
            <p>Saat input/edit Data Penjualan, ada bagian "Rincian Part yang Terjual" — klik "+ Tambah Part" untuk menambah baris, isi No. Part, Nama Part (opsional), Qty, dan Harga Satuan (harga per pcs sebelum diskon, sama seperti kolom "UNIT PRICE" di quotation). Bisa lebih dari satu part per transaksi. Ini dipakai untuk laporan "Part Paling Banyak Terjual" dan tidak wajib diisi kalau tidak diperlukan. Kalau upload PDF quotation, rincian part ini akan coba dibaca otomatis dari tabel di PDF-nya.</p>
          </div>

          <div className="faq-item">
            <h3>Di mana lihat ranking customer paling aktif?</h3>
            <p>Buka tab <strong>"Laporan Tahunan"</strong>, scroll ke bagian bawah — ada tabel "Ranking Customer Paling Aktif Bertransaksi" (diurutkan dari jumlah transaksi terbanyak) dan "Part Paling Banyak Terjual" (diurutkan dari qty terbanyak).</p>
          </div>

          <div className="faq-item">
            <h3>Upload PDF PO/Quotation otomatis, akurat tidak?</h3>
            <p>Ini bantuan tebakan otomatis (nominal, no. dokumen, customer, tanggal) berdasarkan pola teks yang umum dipakai. Selalu cek ulang hasilnya sebelum diklik Simpan, karena format tiap dokumen bisa berbeda-beda. File PDF itu sendiri tidak ikut tersimpan di tracker, hanya dipakai untuk membaca teksnya sekali saat upload.</p>
          </div>

          <div className="faq-item">
            <h3>Bagaimana cara membuat Penawaran (Quotation) dan kirim ke customer?</h3>
            <p>Buka tab <strong>"Buat Penawaran"</strong>. Cara paling cepat: klik <strong>"Upload PDF Penawaran Asli"</strong> dan pilih file PDF quotation yang sudah pernah terbit (dari sistem AIS atau format manual) — No. Dokumen, Tanggal, Customer, Alamat, Model, Serial Number, dan semua Rincian Part otomatis terisi. Atau isi manual: pilih format dulu (<strong>AIS System</strong> satu tabel, atau <strong>Manual BMP</strong> 3 bagian Spare Parts/Consumable/Service). Setelah terisi, klik <strong>"Simpan Penawaran"</strong> supaya masuk ke Riwayat Penawaran (bisa dicari & diedit lagi kapan saja), lalu <strong>"Export ke PDF"</strong> untuk mencetak — nanti muncul dialog print bawaan browser, pilih "Save as PDF", nama filenya otomatis mengikuti No. Dokumen.</p>
          </div>

          <div className="faq-item">
            <h3>Penawaran yang sudah dibuat, bisa dicari dan diedit lagi tidak?</h3>
            <p>Bisa. Setelah klik <strong>"Simpan Penawaran"</strong>, penawaran itu masuk ke daftar <strong>"Riwayat Penawaran"</strong> di bawah form (tersimpan per kuartal sesuai Tanggal Dokumennya). Ada kolom pencarian berdasarkan No. Dokumen atau nama Customer. Klik <strong>"Edit"</strong> pada salah satu penawaran untuk memuat ulang semua datanya ke form dan mengubahnya, lalu klik "Update Penawaran Tersimpan" untuk menyimpan perubahannya.</p>
          </div>

          <div className="faq-item">
            <h3>Apakah Part Number yang diketik di Buat Penawaran ikut tersimpan untuk rekomendasi berikutnya?</h3>
            <p>Ya. Setiap kali Penawaran disimpan, semua No. Part & Nama Part yang ada di dalamnya otomatis masuk ke "kamus part" global tracker — sama seperti part yang diketik lewat Data Penjualan. Kamus ini dipakai untuk menyarankan Nama Part & Harga otomatis saat membuat penawaran berikutnya untuk part yang sama.</p>
          </div>

          <div className="faq-item">
            <h3>Amankah kalau HP hilang atau tracker error?</h3>
            <p>Data utama aman di Cloud, tidak tersimpan di HP. Kalau HP hilang, tinggal buka tracker dari perangkat lain dan sambungkan dengan API Key + Bin ID yang sama. File backup .json adalah lapisan pengaman tambahan di luar itu.</p>
          </div>

          <div className="faq-item">
            <h3>Amankah kalau input dari HP dan PC di waktu yang bersamaan?</h3>
            <p>Sebaiknya dihindari. Sistem penyimpanan gratis yang dipakai tracker ini membaca-lalu-menulis seluruh data sekaligus, bukan per-catatan — jadi kalau dua perangkat sama-sama menyimpan dalam waktu yang nyaris bersamaan, yang tersimpan belakangan bisa menimpa perubahan dari perangkat yang lain. Untuk penggunaan normal (input satu-satu, gantian device) ini tidak masalah. Kalau memang perlu input dari dua perangkat sekaligus dalam waktu yang sama, sebaiknya salah satunya menunggu beberapa detik dulu setelah yang lain menyimpan, dan sesekali klik "Backup Data Cloud (JSON)" sebagai jaring pengaman.</p>
          </div>

          <div className="faq-item">
            <h3>Kalau penawaran sudah deal, apa perlu input ulang manual di Data Penjualan?</h3>
            <p>Tidak perlu. Di "Riwayat Penawaran", klik tombol hijau <strong>"Deal"</strong> pada penawaran yang bersangkutan — sistem otomatis membuat entri baru di Data Penjualan dengan nominal, customer, dan rincian part yang sama persis, tanpa perlu mengetik ulang. Penawaran yang sudah di-deal akan ditandai "sudah Deal" di riwayatnya.</p>
          </div>

          <div className="faq-item">
            <h3>Apa arti status Deal, Lost, dan Perlu Follow Up di Riwayat Penawaran?</h3>
            <p><strong>Deal</strong>: sekali klik, penawaran langsung masuk Data Penjualan dengan tanggal hari kamu klik Deal, jadi masuk kuartal saat deal terjadi (salah klik? pakai "Batal Deal"). <strong>Lost</strong>: penawaran gagal, alasan boleh diisi (bisa "Buka lagi"). <strong>Open</strong> yang sudah lewat <strong>7 hari kerja</strong> (Senin sampai Jumat, di luar hari libur) sejak tanggal penawaran atau follow up terakhir otomatis muncul di kotak kuning "Perlu follow up" dan di angka pada tab menu. Klik <strong>Draft FU</strong> untuk mendapat draft WA dan email follow up ke customer, kirim, lalu klik <strong>Sudah FU</strong>; hitungan 7 hari kerja mulai lagi. Penawaran Open yang sudah <strong>3 bulan</strong> tanpa Deal otomatis dianggap <strong>Lost</strong> (dihitung sebagai Lost di laporan), tapi tetap bisa dicari: ketik di kolom cari (mencakup semua kuartal tahun yang dibuka) atau pakai tab Lost. Klik <strong>Buka lagi</strong> kalau ternyata masih berjalan; hitungan 3 bulan mulai dari hari itu. Pengingat dan pencarian hanya mencakup tahun yang sudah dibuka di tracker ini. Penawaran lama yang menumpuk bisa dirapikan sekaligus lewat <strong>"Rapikan penawaran lama sekaligus"</strong> di kotak kuning: yang No. Dokumennya sudah ada di Data Penjualan jadi Deal, sisanya jadi <strong>Arsip</strong> (tidak dihitung di win rate dan tidak muncul di pengingat, bisa dibuka lagi).</p>
          </div>
          <div className="faq-item">
            <h3>Penawaran sudah PO, gimana menyamakan dengan PQ asli di AIS?</h3>
            <p>Kalau penawaran dibuat di tracker (mis. dari HP) dengan nomor sementara PQ + 5 angka, lalu nomor PQ asli baru kamu dapat dari AIS di kantor, ada dua cara di Riwayat Penawaran. <strong>(1) Ganti ke PQ AIS:</strong> isi nomor AIS saja (mis. 2602PQ06729), isi penawaran tidak berubah. <strong>(2) Samakan dari PDF AIS:</strong> pilih PDF PQ dari AIS, maka nomor, tanggal, customer, dan seluruh baris part diganti sesuai AIS. Baris dengan No. Part yang sama tetap membawa stock, remark, dan jenis supersede yang sudah kamu isi, dan ada ringkasan perbedaannya (part baru, part yang tidak ada di PDF, harga atau qty yang berubah). Setelah dicek, klik <strong>Update Penawaran Tersimpan</strong>. Kedua cara mencatat nomor tracker lama sebagai "No. tracker" (tidak akan disarankan lagi dan bisa dipakai untuk mencari). Kalau penawarannya sudah Deal, nomor di Data Penjualan ikut disamakan, dan nilai serta part-nya ikut diperbarui bila totalnya berubah.</p>
          </div>
          <div className="faq-item">
            <h3>Dari mana saran nomor penawaran (mis. PQ00035)?</h3>
            <p>Di bawah kolom No. Dokumen (penawaran baru) muncul <strong>Saran nomor berikutnya</strong>: nomor PQ terbesar yang sudah tersimpan di tahun itu, ditambah satu. Hanya nomor berformat persis <strong>PQ + 5 angka</strong> (mis. PQ00034) yang dihitung, nomor salinan AIS seperti 2602PQ06729 tidak ikut. Tahun ditentukan dari Tanggal Dokumen, dan urutan mulai lagi dari PQ00001 saat ganti tahun. Nomor baru dianggap terpakai setelah penawarannya <strong>disimpan</strong>, jadi simpan dulu sebelum kirim ke customer. Baris kecil di bawah saran menampilkan nomor terakhir yang dipakai sebagai dasar; kalau tidak sesuai dengan kenyataanmu (misalnya nomor terakhir belum pernah dicatat di tracker), ketik nomor yang benar sendiri lalu simpan, dan saran berikutnya mengikuti.</p>
          </div>
          <div className="faq-item">
            <h3>Gimana menandai stock part (Jakarta, Cikarang, Indent, dst)?</h3>
            <p>Klik <strong>+ Stock / Indent</strong> di baris part, lalu pilih lokasi: cabang/depo Berca (Cilegon, Jakarta, Cikarang, dan cabang lain), <strong>Indent</strong> (isi asal: China, Singapura, Jepang, atau ketik sendiri), atau <strong>Lainnya</strong> (teks bebas). Kalau barangnya tersebar, klik <strong>+ Lokasi lain</strong> dan isi <strong>Jml</strong> per lokasi (mis. diminta 5: 3 di Cilegon, 2 di Cikarang). Kolom <strong>Est. hari</strong> boleh diisi untuk estimasi tiba. Jumlah yang terisi dibandingkan dengan Qty yang diminta, dan diberi peringatan kalau melebihi. Di penawaran AIS tampil sebagai baris kecil tebal di bawah part; di penawaran Manual juga di bawah nama part (kolom Remark tidak dipakai supaya baris tidak membengkak). Kalau ada minimal satu baris berisi stock, otomatis muncul catatan bahwa ketersediaan stock dapat berubah. Stock sengaja tidak disimpan di Katalog Part karena cepat berubah, jadi isi per penawaran. <strong>Samakan lokasi ke semua baris</strong> menyalin daftar lokasi baris itu ke semua part (jumlahnya tidak ikut disalin).</p>
          </div>
          <div className="faq-item">
            <h3>Supersede di penawaran itu apa?</h3>
            <p>Kalau PDF penawaran AIS asli mencetak nomor part di baris bawah part (tanpa kata apa pun), sistem membacanya sebagai <strong>No. Part lama</strong>: part di penawaran adalah <strong>part baru</strong> yang menggantikannya (sesuai kolom Old P/N di AIS Parts Availability). Tampil di penawaran sebagai "PART NO. BARU, menggantikan No. Part lama : ...". Kalau kebalikannya (part yang kamu tawarkan sudah di-supersede menjadi nomor baru, atau kolom New P/N di AIS terisi), ubah <strong>jenisnya</strong> di baris itu menjadi "Part ini di-SUPERSEDE menjadi No. Part baru", dan tampilannya berubah menjadi "SUPERSEDE, diganti menjadi No. Part baru : ...". Nomor dan jenisnya bisa diisi/diedit manual per baris, tersimpan di Katalog Part, dan ikut ke draft WA/email supaya customer tahu ada pergantian.</p>
          </div>

          <div className="faq-item">
            <h3>Bisa dipakai untuk lebih dari satu tahun?</h3>
            <p>Bisa. Gunakan panah di sebelah "Tahun" untuk pindah ke tahun berikutnya. Data tersimpan terpisah per tahun dan kuartal, jadi tracker ini bisa terus dipakai untuk tahun-tahun mendatang tanpa data lama tertimpa.</p>
          </div>
        </React.Fragment>
      )}

      {helpKey && HELP[helpKey] && (
        <div className="help-overlay no-print" onClick={()=>setHelpKey(null)}>
          <div className="help-box" onClick={e=>e.stopPropagation()}>
            <div className="help-title"><span>{HELP[helpKey].title}</span><span className="help-close" role="button" onClick={()=>setHelpKey(null)}>&times;</span></div>
            <div className="help-body">{HELP[helpKey].body}</div>
          </div>
        </div>
      )}

    </div>
  );
}

function SetupScreen({onConnected}){
  const [apiKey,setApiKey] = useState("");
  const [binId,setBinId] = useState("");
  const [status,setStatus] = useState(null); // {ok:bool, msg:string}
  const [testing,setTesting] = useState(false);
  const [newBinId,setNewBinId] = useState("");

  const testAndSave = async()=>{
    const key = apiKey.trim();
    const bin = binId.trim();
    if(!key){ setStatus({ok:false, msg:"Token belum diisi."}); return; }
    setTesting(true); setStatus(null); setNewBinId("");
    try{
      const H = {"Authorization":"Bearer "+key, "Accept":"application/vnd.github+json"};
      if(bin){
        const res = await fetch("https://api.github.com/gists/" + bin, { headers: H });
        if(!res.ok){
          const errData = await res.json().catch(()=>({}));
          throw new Error(errData.message || ("HTTP " + res.status));
        }
        window.__setCloudCfg(key, bin);
        setStatus({ok:true, msg:"Berhasil tersambung ke Gist yang sudah ada! Mengalihkan..."});
        setTimeout(()=>onConnected(), 700);
      } else {
        const res = await fetch("https://api.github.com/gists", {
          method: "POST",
          headers: Object.assign({"Content-Type":"application/json"}, H),
          body: JSON.stringify({ description:"Tracker VCS DB", public:false, files:{ "tracker.json": { content: JSON.stringify({ _tracker_db: true, _created: new Date().toISOString() }) } } })
        });
        if(!res.ok){
          const errData = await res.json().catch(()=>({}));
          throw new Error(errData.message || ("HTTP " + res.status));
        }
        const data = await res.json();
        const createdId = data && data.id;
        if(!createdId) throw new Error("Gist ID tidak ditemukan di respons.");
        window.__setCloudCfg(key, createdId);
        setNewBinId(createdId);
        setStatus({ok:true, msg:"Gist baru berhasil dibuat & tersambung! Catat Gist ID di bawah ini sebelum lanjut."});
      }
    }catch(e){
      setStatus({ok:false, msg:"Gagal tersambung. Detail: " + (e && e.message ? e.message : String(e))});
    }finally{
      setTesting(false);
    }
  };

  return (
    <div className="setup-wrap">
      <div className="setup-card">
        <h1>Hubungkan Tracker ke Cloud</h1>
        <p>Supaya data bisa diinput dari HP, PC, atau perangkat mana saja dan tetap sinkron, tracker ini disambungkan ke satu penyimpanan online lewat GitHub Gist. Semua langkahnya bisa dilakukan dari HP, tidak perlu buka editor kode apapun.</p>
        <ol>
          <li>Buka <strong>github.com/settings/tokens</strong>, buat <strong>Personal access token (classic)</strong> dengan centang <strong>gist</strong> saja.</li>
          <li>Salin token yang muncul (hanya tampil sekali).</li>
          <li>Tempel token itu di kolom pertama bawah ini.</li>
          <li>Kalau ini perangkat <strong>pertama kali</strong> setup, kosongkan kolom Gist ID lalu klik tombol di bawah &mdash; sistem akan buatkan tempat penyimpanan baru otomatis.</li>
          <li>Kalau ini perangkat <strong>kedua dst</strong> (mis. sudah setup di HP, sekarang di PC), isi juga kolom Gist ID dengan ID yang sudah dicatat sebelumnya, biar nyambung ke data yang sama.</li>
        </ol>
        <input type="text" placeholder="Token GitHub (izin gist)" value={apiKey} onChange={e=>setApiKey(e.target.value)} />
        <input type="text" placeholder="Gist ID (kosongkan kalau baru pertama kali setup)" value={binId} onChange={e=>setBinId(e.target.value)} />
        <button className="add-btn" style={{marginTop:0}} onClick={testAndSave} disabled={testing}>
          {testing ? "Menguji koneksi..." : "Uji & Simpan Koneksi"}
        </button>
        {status && <div className={"setup-status "+(status.ok?"ok":"bad")}>{status.msg}</div>}
        {newBinId && (
          <div style={{marginTop:14}}>
            <label style={{fontFamily:"var(--sans)",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5,color:"var(--muted)"}}>Gist ID (catat ini untuk sambungkan device lain)</label>
            <input type="text" readOnly value={newBinId} onFocus={e=>e.target.select()} style={{marginTop:6,fontWeight:700}} />
            <button className="icon-btn" style={{marginTop:8}} onClick={()=>onConnected()}>Lanjut ke Tracker &rarr;</button>
          </div>
        )}
      </div>
    </div>
  );
}

function App(){
  const [cloudCfg,setCloudCfgState] = useState(window.__getCloudCfg ? window.__getCloudCfg() : {apiKey:"",binId:""});
  const isConnected = !!(cloudCfg.apiKey && cloudCfg.binId);
  if(!isConnected){
    return <SetupScreen onConnected={()=>setCloudCfgState(window.__getCloudCfg())} />;
  }
  return <MainApp onDisconnect={()=>{ window.__clearCloudCfg(); setCloudCfgState({apiKey:"",binId:""}); }} binId={cloudCfg.binId} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
